<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prototipo Híbrido · Responsive · Gasolineras</title>
<link rel="preload" as="script" href="./datos-fake.js">
<script src="./datos-fake.js"></script>
<style>
/* ============================================================================
   PROTOTIPO HÍBRIDO — RESPONSIVE UNIFICADO (pass 4)
   Un solo código, breakpoints 640 / 1024 / 1280 px.
   Móvil: pestañas inferiores + tarjetas + bottom sheet.
   Tablet: barra lateral colapsable + mapa grande.
   Escritorio: rail fijo + mapa héroe + ficha derecha.
   Incluye: modo oscuro, skeletons de carga, pull-to-refresher, accesos teclado.
   ============================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f4f6f9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 4px 18px rgba(0,0,0,0.09);
  --radius: 12px;
  --touch: 44px;
  --rail-w: 270px;
  --detail-w: 440px;
}
/* Modo oscuro */
body.dark {
  --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --line: #334155;
}
body.dark .app-header, body.dark .center-header, body.dark .rail, body.dark .detail-panel,
body.dark .station-card, body.dark .detail-field, body.dark .chart-wrap, body.dark .fuel-pill,
body.dark .bottom-nav, body.dark .sidebar, body.dark .detail-dock {
  background: var(--surface) !important;
  color: var(--text);
  border-color: var(--line) !important;
}
body.dark .station-card { border-color: var(--line); color: var(--text); }
body.dark .station-card .name { color: var(--text); }
body.dark .station-card .addr { color: var(--muted); }
body.dark .map-canvas { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
body.dark .kbd, body.dark .select-wrap, body.dark input, body.dark select { background: #334155; color: var(--text); border-color: var(--line); }

html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

/* ===== Skeleton (estados de carga) ===== */
.skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; color: transparent !important; }
body.dark .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-text { height: 0.95rem; border-radius: 4px; margin-bottom: 0.5rem; }
.skeleton-text.wide { width: 90%; }
.skeleton-text.short { width: 55%; }
.skeleton-avatar { width: 44px; height: 44px; border-radius: 50%; }
.skeleton-line { height: 1rem; border-radius: 4px; margin-bottom: 0.4rem; }

/* ===== Shell ===== */
.app { display: flex; flex-direction: column; height: 100vh; position: relative; }
.app-header {
  position: sticky; top: 0; z-index: 60; background: rgba(255,255,255,0.86);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding: max(0.5rem, env(safe-area-inset-top)) 1rem 0.6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
body.dark .app-header { background: rgba(15,23,42,0.86); }
.app-brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1rem; letter-spacing: -0.3px; color: var(--brand); }
.app-actions { display: flex; gap: 0.3rem; align-items: center; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }
body.dark .icon-btn { background: var(--surface); color: var(--text); }

/* ===== Split (tablet/desktop) ===== */
.app-body { display: flex; flex: 1; overflow: hidden; }
.rail {
  width: var(--rail-w); flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
  overflow-y: auto; z-index: 30;
}
.rail-header { padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 0.5rem; background: #fff; }
body.dark .rail-header { background: var(--surface); }
.rail-brand { font-weight: 800; font-size: 1rem; color: var(--brand); }
.rail-section { padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--line); background: var(--surface); }
.rail-section:last-child { border-bottom: none; }
.rail-section h5 { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.35rem; }

select, input { width: 100%; padding: 0.45rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; font-size: 0.82rem; background: var(--surface); color: var(--text); margin-bottom: 0.5rem; box-sizing: border-box; }
select:focus, input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }

.chip-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.78rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--shadow); }

.quick { display: flex; flex-direction: column; gap: 0.4rem; }
.quick-btn { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.8rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 0.82rem; cursor: pointer; text-align: left; transition: background 0.15s, border-color 0.15s; }
.quick-btn:hover { background: #f8fafc; border-color: var(--brand); }
.quick-btn .k { font-size: 0.68rem; color: var(--muted); background: #eef2ff; padding: 0.12rem 0.4rem; border-radius: 4px; border: 1px solid #c7d2fe; }
body.dark .quick-btn .k { background: #1e293b; border-color: #334155; color: #93c5fd; }

/* Centro: mapa héroe */
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.center-header {
  position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.86);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding: 0.6rem 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
body.dark .center-header { background: rgba(15,23,42,0.86); }
.center-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.45rem; }
.center-actions { display: flex; gap: 0.35rem; align-items: center; }
.map-wrap { position: relative; flex: 1; min-height: 0; background: #dbeafe; border: 1px solid var(--line); overflow: hidden; }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
body.dark .map-canvas { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
.map-marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); cursor: pointer; transform: translate(-50%, -50%); display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; z-index: 5; transition: transform 0.15s, box-shadow 0.15s; }
.map-marker:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
.map-marker.green { background: var(--green); }
.map-marker.orange { background: var(--orange); }
.map-marker.red { background: var(--red); }
.map-marker.selected { border-color: var(--brand); box-shadow: 0 0 0 5px rgba(26,115,232,0.4); }
.map-layer { position: absolute; inset: 0; pointer-events: none; }
.empty-map { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); background: var(--surface); z-index: 3; }
.empty-map .icon { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.35; }

/* Detalle (derecha escritorio / bottom móvil/tablet) */
.detail-panel {
  width: var(--detail-w); flex-shrink: 0; background: var(--surface);
  border-left: 1px solid var(--line); display: flex; flex-direction: column;
  z-index: 25; box-shadow: var(--shadow);
}
.detail-panel.hide { display: none !important; }
.detail-header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line); background: #fff; flex-shrink: 0; }
body.dark .detail-header { background: var(--surface); }
.detail-header h2 { font-size: 1rem; flex: 1; }
.detail-close { background: none; border: none; font-size: 1.1rem; color: #94a3b8; cursor: pointer; padding: 0.25rem; border-radius: 6px; }
.detail-close:hover { background: #f1f3f5; color: var(--text); }
.detail-body { flex: 1; overflow-y: auto; padding: 1rem 1.1rem; display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.detail-field { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.75rem; }
body.dark .detail-field { background: #334155; }
.detail-field .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; display: block; margin-bottom: 0.15rem; }
.detail-field .val { font-size: 0.84rem; font-weight: 700; color: var(--text); word-break: break-all; }
.detail-fuels { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.2rem; }
.fuel-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--line); background: #fff; }
body.dark .fuel-pill { background: var(--surface); color: var(--text); border-color: var(--line); }
.fuel-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.detail-chart { grid-column: 1 / -1; }
.detail-chart h4 { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.3rem; }
.chart-wrap { position: relative; width: 100%; height: 180px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
body.dark .chart-wrap { background: var(--surface); }
.detail-actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; margin-top: 0.4rem; }
.detail-btn { flex: 1; padding: 0.6rem; border-radius: 10px; border: none; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
.detail-btn.primary { background: var(--brand); color: #fff; }
.detail-btn.outline { background: #fff; border: 1px solid var(--line); color: var(--text); }
body.dark .detail-btn.outline { background: var(--surface); color: var(--text); }

/* Pull-to-refresher visual */
.ptr { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.ptr.show { opacity: 1; }
.ptr .spin { width: 20px; height: 20px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Bottom nav (móvil) */
.bottom-nav { display: none; position: fixed; bottom: max(env(safe-area-inset-bottom), 0.5rem); left: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem; box-shadow: var(--shadow); z-index: 60; }
body.dark .bottom-nav { background: var(--surface); border-color: var(--line); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.42rem 0.25rem; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.62rem; color: #94a3b8; min-height: var(--touch); }
.nav-tab .icon { font-size: 1.25rem; line-height: 1; }
.nav-tab.active { background: #eef2ff; color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
body.dark .nav-tab.active { background: #1e3a5f; color: var(--brand); }

/* FAB */
.fab-wrap { position: fixed; bottom: 150px; right: 1rem; z-index: 55; }
.fab { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #fff; border: none; box-shadow: 0 4px 14px rgba(26,115,232,0.35); cursor: pointer; display: grid; place-items: center; font-size: 1.4rem; transition: transform 0.15s; }
.fab:active { transform: scale(0.92); }

/* Toast */
.toast { position: fixed; top: 1.1rem; left: 50%; transform: translate(-50%, 0) scale(0.9); background: rgba(30,30,40,0.9); color: #fff; padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.8rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 120; white-space: nowrap; }
body.dark .toast { background: rgba(15,23,42,0.92); }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
@media (max-width: 1023px) { .toast { top: auto; bottom: max(160px, env(safe-area-inset-bottom) + 1rem); } }

/* ===== RESPONSIVE ===== */
/* Móvil puro (<640): rail oculto, detalle bottom sheet, bottom nav visible */
@media (max-width: 639px) {
  .rail { position: fixed; inset: 0 0 0 auto; width: 260px; transform: translateX(100%); transition: transform 0.25s; box-shadow: 6px 0 24px rgba(0,0,0,0.12); }
  .rail.open { transform: translateX(0); }
  .rail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 29; display: none; backdrop-filter: blur(2px); }
  .rail-overlay.open { display: block; }
  .center { width: 100%; }
  .center-header { display: none; }
  .detail-panel { position: fixed; inset: 0 0 auto 0; width: 100%; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); border-left: none; border-top: 1px solid var(--line); }
  .detail-panel.open { transform: translateY(0); display: flex; }
  .detail-panel.hide { display: none !important; }
  .detail-grid { grid-template-columns: 1fr; }
  .chart-wrap { height: 150px; }
  .bottom-nav { display: flex; }
  .fab-wrap { display: block; }
  .ptr { top: 70px; }
}

/* Tablet (640–1023): rail colapsable por defecto, detalle bottom */
@media (min-width: 640px) and (max-width: 1023px) {
  .rail { position: fixed; inset: 0 0 0 auto; width: 300px; transform: translateX(100%); transition: transform 0.25s; box-shadow: 6px 0 24px rgba(0,0,0,0.12); }
  .rail.open { transform: translateX(0); }
  .rail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 29; display: none; backdrop-filter: blur(2px); }
  .rail-overlay.open { display: block; }
  .center { width: 100%; }
  .center-header { display: flex; }
  .detail-panel { position: fixed; inset: 0 0 auto 0; width: 100%; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); border-left: none; border-top: 1px solid var(--line); }
  .detail-panel.open { transform: translateY(0); display: flex; }
  .detail-panel.hide { display: none !important; }
  .detail-grid { grid-template-columns: 1fr 1fr; }
  .chart-wrap { height: 160px; }
  .bottom-nav { display: flex; }
  .fab-wrap { display: block; }
}

/* Escritorio (≥1024): rail visible fijo, detalle panel derecho */
@media (min-width: 1024px) {
  .rail { position: relative; transform: none !important; box-shadow: none; border-right: 1px solid var(--line); }
  .rail-overlay { display: none !important; }
  .center { width: 100%; }
  .center-header { display: flex; }
  .detail-panel { position: relative; transform: none !important; border-left: 1px solid var(--line); border-top: none; }
  .detail-panel.hide { display: none !important; }
  .detail-panel:not(.hide) { display: flex; }
  .bottom-nav { display: none; }
  .fab-wrap { display: none; }
  .detail-grid { grid-template-columns: 1fr 1fr; }
  .chart-wrap { height: 180px; }
}
/* Escritorio amplio (≥1280): rail más ancho */
@media (min-width: 1280px) {
  :root { --rail-w: 300px; }
  .rail { width: var(--rail-w); }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="app-header">
    <div class="app-brand">⛽ Gasolineras</div>
    <div class="app-actions">
      <button class="icon-btn" id="btnMenu" title="Menú">☰</button>
      <button class="icon-btn" id="btnSearch" title="Buscar">🔍</button>
      <button class="icon-btn" id="btnTheme" title="Modo oscuro">🌓</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Rail lateral -->
    <aside class="rail" id="rail">
      <div class="rail-header">
        <div class="rail-brand">Gasolineras</div>
      </div>
      <div class="rail-section">
        <h5>📍 Filtros</h5>
        <select id="selProv"></select>
        <select id="selFuel"></select>
        <select id="selBrand"></select>
        <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.35rem">
          <input type="checkbox" id="chkFav" style="width:auto;margin:0">
          <span style="font-size:0.82rem;color:var(--text)">Solo favoritos</span>
        </div>
        <button class="chip" id="btnReset" style="width:100%;justify-content:center;margin-top:0.2rem">Limpiar ✕</button>
      </div>
      <div class="rail-section">
        <h5>🚀 Accesos rápidos</h5>
        <div class="quick">
          <button class="quick-btn" id="qNear"><span class="k">G</span>Cercas de mí</button>
          <button class="quick-btn" id="qCheapest"><span class="k">B</span>Más barata</button>
          <button class="quick-btn" id="qFavs"><span class="k">F</span>Favoritos</button>
          <button class="quick-btn" id="qIA"><span class="k">I</span>Asistente IA</button>
        </div>
      </div>
    </aside>
    <div class="rail-overlay" id="railOverlay"></div>

    <!-- Centro -->
    <div class="center">
      <div class="center-header">
        <div class="center-title" id="centerTitle">🗺️ Mapa de estaciones</div>
        <div class="center-actions">
          <span id="centerCount" style="font-size:0.75rem;color:var(--muted);background:#f1f5f9;padding:0.15rem 0.55rem;border-radius:10px;border:1px solid #cbd5e1">0 estaciones</span>
        </div>
      </div>
      <div class="ptr" id="ptr"><div class="spin"></div>Actualizando…</div>
      <div class="map-wrap" id="mapWrap">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
        <div class="empty-map" id="emptyMap">
          <div class="icon">🗺️</div>
          <div>Selecciona una estación para ver su detalle</div>
        </div>
      </div>
    </div>

    <!-- Detalle (panel derecho en escritorio, bottom sheet en móvil/tablet) -->
    <div class="detail-panel hide" id="detail">
      <div class="detail-header">
        <h2 id="detailName">Estación</h2>
        <button class="detail-close" id="btnDetailClose">✕</button>
      </div>
      <div class="detail-body">
        <div class="detail-grid" id="detailGrid"></div>
        <div class="detail-fuels" id="detailFuels"></div>
        <div class="detail-chart">
          <h4>📈 Histórico (últimos 14 días)</h4>
          <div class="chart-wrap"><canvas id="detailChart"></canvas></div>
        </div>
        <div class="detail-actions">
          <button class="detail-btn outline" id="btnDetailFav">⭐ Favorito</button>
          <button class="detail-btn primary" id="btnDetailMap">Centrar en mapa</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom nav móvil -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-view="mapa"><span class="icon">🗺️</span><span>Mapa</span></button>
    <button class="nav-tab" data-view="ia"><span class="icon">🤖</span><span>IA</span></button>
    <button class="nav-tab" data-view="config"><span class="icon">⚙️</span><span>Config</span></button>
  </nav>

  <!-- FAB -->
  <div class="fab-wrap">
    <button class="fab" id="btnGeo" title="Ubicación actual">📍</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const { ESTACIONES, MARCAS_UNICAS, COMBUSTIBLES, PROVINCIAS, precioActual, fechaDDMMYYYY } = window.DATOS_FAKE;

const els = {
  selProv: document.getElementById('selProv'), selFuel: document.getElementById('selFuel'), selBrand: document.getElementById('selBrand'),
  chkFav: document.getElementById('chkFav'), btnReset: document.getElementById('btnReset'),
  btnMenu: document.getElementById('btnMenu'), btnSearch: document.getElementById('btnSearch'), btnTheme: document.getElementById('btnTheme'),
  rail: document.getElementById('rail'), railOverlay: document.getElementById('railOverlay'),
  centerCount: document.getElementById('centerCount'), ptr: document.getElementById('ptr'),
  mapCanvas: document.getElementById('mapCanvas'), mapLayer: document.getElementById('mapLayer'),
  emptyMap: document.getElementById('emptyMap'),
  detail: document.getElementById('detail'), btnDetailClose: document.getElementById('btnDetailClose'),
  detailName: document.getElementById('detailName'), detailGrid: document.getElementById('detailGrid'),
  detailFuels: document.getElementById('detailFuels'), detailChart: document.getElementById('detailChart'),
  btnDetailFav: document.getElementById('btnDetailFav'), btnDetailMap: document.getElementById('btnDetailMap'),
  navTabs: document.querySelectorAll('.nav-tab'),
  btnGeo: document.getElementById('btnGeo'),
  toast: document.getElementById('toast'),
  qNear: document.getElementById('qNear'), qCheapest: document.getElementById('qCheapest'), qFavs: document.getElementById('qFavs'), qIA: document.getElementById('qIA'),
};

const state = {
  selected: null,
  filters: { prov: '', fuel: '', brand: '', fav: false },
  favorites: new Set(JSON.parse(localStorage.getItem('pfavH') || '[]')),
  userLat: null, userLng: null,
  focusedIndex: -1,
  loading: false,
};

function toast(msg) {
  const t = els.toast; t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" })[c]); }
function fmtEur(p) { return p == null ? '—' : p.toFixed(3).replace('.', ',') + ' €/L'; }
function distKm(lat1, lng1, lat2, lng2) {
  if (lat1 == null || lng1 == null) return null;
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)) * 10) / 10;
}
function precioColor(p) { if (p == null) return '#9ca3af'; if (p < 1.50) return '#2e7d32'; if (p < 1.70) return '#f57c00'; return '#c62828'; }

// Selects
(function llenarSelects() {
  PROVINCIAS.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; els.selProv.appendChild(o); });
  COMBUSTIBLES.forEach(c => { const o = document.createElement('option'); o.value = c.nombre; o.textContent = c.nombre; els.selFuel.appendChild(o); });
  MARCAS_UNICAS.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; els.selBrand.appendChild(o); });
})();
els.selProv.addEventListener('change', e => { state.filters.prov = e.target.value; state.focusedIndex = -1; render(); });
els.selFuel.addEventListener('change', e => { state.filters.fuel = e.target.value; state.focusedIndex = -1; render(); });
els.selBrand.addEventListener('change', e => { state.filters.brand = e.target.value; state.focusedIndex = -1; render(); });
els.chkFav.addEventListener('change', e => { state.filters.fav = e.target.checked; render(); });
els.btnReset.addEventListener('click', () => {
  els.selProv.value = ''; els.selFuel.value = ''; els.selBrand.value = ''; els.chkFav.checked = false;
  state.filters = { prov: '', fuel: '', brand: '', fav: false }; state.focusedIndex = -1;
  render();
});

// Menú móvil
els.btnMenu.addEventListener('click', () => {
  const open = !els.rail.classList.contains('open');
  els.rail.classList.toggle('open', open);
  els.railOverlay.classList.toggle('open', open);
});
els.railOverlay.addEventListener('click', () => { els.rail.classList.remove('open'); els.railOverlay.classList.remove('open'); });

// Tema
els.btnTheme.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  toast(document.body.classList.contains('dark') ? 'Modo oscuro activado' : 'Modo claro');
});

// Búsqueda rápida (simulada)
els.btnSearch.addEventListener('click', () => {
  const q = prompt('Buscar localidad, calle o marca…', '');
  if (q != null) { state.filters.q = q.toLowerCase().trim(); render(); toast('Búsqueda: ' + (q || 'ninguna')); }
});

function filtradas() {
  let arr = ESTACIONES.filter(e => {
    if (state.filters.prov && e.Provincia !== state.filters.prov) return false;
    if (state.filters.fuel) {
      const c = COMBUSTIBLES.find(x => x.nombre === state.filters.fuel);
      if (!c || precioActual(e, c.clave) == null) return false;
    }
    if (state.filters.brand && e.Rótulo !== state.filters.brand) return false;
    if (state.filters.fav && !state.favorites.has(e.IDEESS)) return false;
    if (state.filters.q) {
      const q = state.filters.q;
      return (e.Localidad + ' ' + e['Dirección'] + ' ' + e.Rótulo).toLowerCase().includes(q);
    }
    return true;
  });
  arr.forEach(e => { e._dist = state.userLat != null ? distKm(state.userLat, state.userLng, e.Latitud, e['Longitud (WGS84)']) : null; });
  const clave = state.filters.fuel ? COMBUSTIBLES.find(c => c.nombre === state.filters.fuel).clave : 'Precio Gasolina 95 E5';
  arr.sort((a, b) => (precioActual(a, clave) ?? 9999) - (precioActual(b, clave) ?? 9999));
  return arr;
}

function render() {
  const arr = filtradas();
  els.centerCount.textContent = arr.length + ' estación' + (arr.length !== 1 ? 'es' : '') + (state.filters.prov ? ' en ' + state.filters.prov : '');
  renderMapa(arr);
  if (arr.length === 0) { els.emptyMap.style.display = 'flex'; }
  else { els.emptyMap.style.display = 'none'; }
  renderDetail();
  els.navTabs.forEach(t => t.classList.toggle('active', t.dataset.view === 'mapa'));
}

function renderMapa(arr) {
  const w = els.mapCanvas.clientWidth || 900;
  const h = els.mapCanvas.clientHeight || 600;
  if (arr.length === 0) { els.mapLayer.innerHTML = ''; return; }
  const xs = arr.map(e => e['Longitud (WGS84)']);
  const ys = arr.map(e => e.Latitud);
  const minLng = Math.min(...xs) - 0.02, maxLng = Math.max(...xs) + 0.02;
  const minLat = Math.min(...ys) - 0.02, maxLat = Math.max(...ys) + 0.02;
  const proj = (lat, lng) => {
    const x = (lng - minLng) / (maxLng - minLng || 1);
    const y = 1 - (lat - minLat) / (maxLat - minLat || 1);
    return { x: 45 + x * (w - 90), y: 45 + y * (h - 90) };
  };
  els.mapLayer.innerHTML = '';
  arr.forEach((e, i) => {
    const { x, y } = proj(e.Latitud, e['Longitud (WGS84)']);
    const clave = state.filters.fuel ? COMBUSTIBLES.find(c => c.nombre === state.filters.fuel).clave : 'Precio Gasolina 95 E5';
    const p = precioActual(e, clave);
    const cls = p == null ? '' : p < 1.5 ? 'green' : p < 1.7 ? 'orange' : 'red';
    const m = document.createElement('div');
    m.className = 'map-marker ' + cls + (state.selected === e.IDEESS ? ' selected' : '');
    m.style.left = x + 'px'; m.style.top = y + 'px'; m.textContent = i + 1;
    m.title = e.Rótulo + ' — ' + fmtEur(p);
    m.addEventListener('click', ev => { ev.stopPropagation(); state.focusedIndex = i; abrirDetalle(e); render(); });
    els.mapLayer.appendChild(m);
  });
}

// ----- Detalle -----
function abrirDetalle(e) {
  state.selected = e.IDEESS;
  const clave = state.filters.fuel ? COMBUSTIBLES.find(c => c.nombre === state.filters.fuel).clave : 'Precio Gasolina 95 E5';
  const p = precioActual(e, clave);
  els.detailName.textContent = e.Rótulo;
  els.detailGrid.innerHTML = `
    <div class="detail-field"><span class="lbl">Dirección</span><span class="val">${escHtml(e['Dirección'])}</span></div>
    <div class="detail-field"><span class="lbl">Localidad / Provincia</span><span class="val">${escHtml(e.Localidad)} / ${escHtml(e.Provincia)}</span></div>
    <div class="detail-field"><span class="lbl">CP</span><span class="val">${escHtml(e.CP)}</span></div>
    <div class="detail-field"><span class="lbl">Horario</span><span class="val">${e.Horario}</span></div>
    <div class="detail-field"><span class="lbl">Distancia</span><span class="val">${e._dist != null ? e._dist.toFixed(1) + ' km' : '—'}</span></div>
    <div class="detail-field"><span class="lbl">Precio ${clave.replace('Precio ','')}</span><span class="val" style="color:${precioColor(p)}">${fmtEur(p)}</span></div>
  `;
  els.detailFuels.innerHTML = COMBUSTIBLES.map(c => {
    const pp = precioActual(e, c.clave);
    return `<span class="fuel-pill"><span class="dot" style="background:${c.color}"></span>${c.nombre} ${fmtEur(pp)}</span>`;
  }).join('');
  drawChart(e);
  els.btnDetailFav.textContent = (state.favorites.has(e.IDEESS) ? '★' : '☆') + ' Favorito';
  const isMobile = window.innerWidth <= 1023;
  if (isMobile) { els.detail.classList.add('open'); els.detail.classList.remove('hide'); }
  else { els.detail.classList.remove('hide'); }
  render();
}
function cerrarDetalle() {
  state.selected = null;
  const isMobile = window.innerWidth <= 1023;
  if (isMobile) els.detail.classList.remove('open');
  else els.detail.classList.add('hide');
  render();
}
els.btnDetailClose.addEventListener('click', cerrarDetalle);
els.btnDetailFav.addEventListener('click', () => {
  if (!state.selected) return;
  toggleFav(state.selected);
  els.btnDetailFav.textContent = (state.favorites.has(state.selected) ? '★' : '☆') + ' Favorito';
  render();
});
els.btnDetailMap.addEventListener('click', () => toast('Centrando mapa en la estación (prototipo)'));

function toggleFav(id) {
  if (state.favorites.has(id)) state.favorites.delete(id);
  else state.favorites.add(id);
  localStorage.setItem('pfavH', JSON.stringify([...state.favorites]));
  toast(state.favorites.has(id) ? 'Añadido a favoritos' : 'Eliminado de favoritos');
}

function drawChart(e) {
  const cv = els.detailChart; const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.parentElement.getBoundingClientRect();
  cv.width = rect.width * dpr; cv.height = (rect.height || 180) * dpr;
  ctx.scale(dpr, dpr);
  const h = rect.height || 180;
  ctx.clearRect(0, 0, rect.width, h);
  const hist = (e.historico || []).slice();
  if (hist.length < 2) return;
  const clave = state.filters.fuel ? COMBUSTIBLES.find(c => c.nombre === state.filters.fuel).clave : 'Precio Gasolina 95 E5';
  const vals = hist.map(hh => hh.precios[clave]).filter(v => v != null);
  if (vals.length < 2) return;
  const pad = 18; const w = rect.width;
  const min = Math.min(...vals) * 0.995; const max = Math.max(...vals) * 1.005;
  const stepX = (w - 2 * pad) / (vals.length - 1);
  const toY = v => h - pad - (v - min) / (max - min) * (h - 2 * pad);
  ctx.beginPath(); ctx.lineWidth = 2.6; ctx.strokeStyle = '#1a73e8'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  vals.forEach((v, i) => { const x = pad + i * stepX; const y = toY(v); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke();
  vals.forEach((v, i) => {
    const x = pad + i * stepX; const y = toY(v);
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = i === vals.length - 1 ? '#1a73e8' : '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#1a73e8'; ctx.lineWidth = 1.6; ctx.stroke();
  });
  ctx.font = '10px system-ui'; ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center';
  ctx.fillText(fmtEur(vals[vals.length-1]) + ' hoy', pad + (vals.length-1) * stepX, h - 7);
  ctx.fillText(fmtEur(vals[0]), pad, h - 7);
}

// ----- Accesos rápidos -----
els.qNear.addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Geolocalización no disponible'); return; }
  els.qNear.textContent = '⏳ Cercas de mí';
  navigator.geolocation.getCurrentPosition(pos => {
    state.userLat = pos.coords.latitude; state.userLng = pos.coords.longitude;
    els.qNear.textContent = '📍 Cercas de mí'; state.focusedIndex = -1;
    render(); toast('Ubicación activada — ordenado por distancia');
  }, () => { els.qNear.textContent = 'Cercas de mí'; toast('No se pudo obtener la ubicación'); });
});
els.qCheapest.addEventListener('click', () => {
  const arr = filtradas();
  if (arr.length === 0) { toast('Sin resultados'); return; }
  state.focusedIndex = 0; abrirDetalle(arr[0]); render(); toast('Estación más barata cargada');
});
els.qFavs.addEventListener('click', () => { els.chkFav.checked = true; state.filters.fav = true; render(); toast(state.favorites.size ? state.favorites.size + ' favoritos' : 'Sin favoritos'); });
els.qIA.addEventListener('click', () => toast('Asistente IA — ver prototipo móvil (pestaña IA)'));

// ----- Pull-to-refresher simulado (arrastrar hacia arriba) -----
let ptrStartY = 0, ptrActive = false;
const mapWrap = els.mapWrap;
mapWrap.addEventListener('touchstart', e => {
  if (els.mapLayer.scrollTop === 0 || mapWrap.scrollTop === 0) { ptrStartY = e.touches[0].clientY; ptrActive = true; }
}, { passive: true });
mapWrap.addEventListener('touchmove', e => {
  if (!ptrActive) return;
  const dy = e.touches[0].clientY - ptrStartY;
  if (dy > 0) {
    els.ptr.classList.add('show');
    e.preventDefault();
  }
}, { passive: false });
mapWrap.addEventListener('touchend', async () => {
  if (!ptrActive) { ptrActive = false; return; }
  ptrActive = false;
  if (els.ptr.classList.contains('show')) {
    await refreshSimulado();
    els.ptr.classList.remove('show');
  }
});

async function refreshSimulado() {
  state.loading = true;
  // simula redibujado con ligero cambio de precios
  ESTACIONES.forEach(e => {
    COMBUSTIBLES.forEach(c => {
      const v = precioActual(e, c.clave);
      if (v != null) e[c.clave] = Math.round((v + (Math.random()*0.02 - 0.01)) * 1000) / 1000;
    });
  });
  await new Promise(r => setTimeout(r, 700));
  state.loading = false;
  render();
  toast('Datos actualizados');
}

// ----- Teclado -----
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const arr = filtradas();
    if (!arr.length) return;
    if (e.key === 'ArrowUp') state.focusedIndex = state.focusedIndex <= 0 ? arr.length - 1 : state.focusedIndex - 1;
    else state.focusedIndex = state.focusedIndex >= arr.length - 1 ? 0 : state.focusedIndex + 1;
    abrirDetalle(arr[state.focusedIndex]); render();
  } else if (e.key === 'Enter') {
    const arr = filtradas();
    if (state.focusedIndex >= 0 && arr[state.focusedIndex]) { abrirDetalle(arr[state.focusedIndex]); render(); }
  } else if (e.key === 'Escape') { cerrarDetalle(); state.focusedIndex = -1; render(); }
  else if (e.key === 'd' || e.key === 'D') { document.body.classList.toggle('dark'); toast(document.body.classList.contains('dark') ? 'Modo oscuro' : 'Modo claro'); }
});

// ----- FAB geolocalización -----
els.btnGeo.addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Geolocalización no disponible'); return; }
  els.btnGeo.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(pos => {
    state.userLat = pos.coords.latitude; state.userLng = pos.coords.longitude;
    els.btnGeo.textContent = '📍'; els.btnGeo.classList.add('active');
    render(); toast('Ubicación activada');
  }, () => { els.btnGeo.textContent = '📍'; toast('No se pudo obtener la ubicación'); });
});

// Bottom nav móvil
els.navTabs.forEach(tab => { tab.addEventListener('click', () => { cerrarDetalle(); state.focusedIndex = -1; render(); }); });

// Resize
window.addEventListener('resize', () => { renderMapa(filtradas()); if (state.selected) drawChart(ESTACIONES.find(e => e.IDEESS === state.selected)); });

render();
</script>
