<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>v07 · Torre de control — comparar y decidir, no solo consultar</title>
<style>
:root{
  --fondo:#eef0f4; --panel:#fff; --tinta:#15202b; --sub:#66717e; --linea:#dde2e9;
  --azul:#0b6ef0; --verde:#0a8a3c; --rojo:#c62828; --amb:#b26a00;
  --baja:#0a8a3c; --media:#b26a00; --alta:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--fondo);color:var(--tinta)}
button{font-family:inherit}

.top{height:54px;background:var(--panel);border-bottom:1px solid var(--linea);display:flex;align-items:center;
  gap:10px;padding:0 16px;position:sticky;top:0;z-index:50}
.top .lg{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:9px}
@media(max-width:600px){.top .lgT{display:none}}
.top .lg i{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#0b6ef0,#7fb0ff);color:#fff;
  display:grid;place-items:center;font-style:normal;font-size:.8rem}
.top select{border:1px solid var(--linea);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.85rem;background:#fff}
.top .esp{flex:1}
.top .b{border:1px solid var(--linea);border-radius:10px;background:#fff;padding:8px 13px;font-weight:700;font-size:.82rem;cursor:pointer}
.top .b.pr{background:var(--azul);border-color:var(--azul);color:#fff}

.cont{max-width:1280px;margin:0 auto;padding:14px 16px 40px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr;gap:10px}}
.kpi{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:14px 16px;min-width:0}
.kpi .e{font-size:.72rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;display:flex;justify-content:space-between;gap:8px}
.kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:.8rem;font-weight:600;color:var(--sub);letter-spacing:0}
.kpi .x{font-size:.78rem;color:var(--sub);margin-top:6px}
.kpi .mr{font-size:1rem!important}

/* panes */
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);gap:14px}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.tarj{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:16px;min-width:0}
.tarj h3{margin:0 0 2px;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.tarj .st{font-size:.76rem;color:var(--sub);margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.leg{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;border:1px solid var(--linea);
  border-radius:999px;padding:5px 10px;background:#fff;cursor:pointer}
.leg .sw{width:12px;height:12px;border-radius:4px}
.leg.off{opacity:.38;text-decoration:line-through}
.chartX{width:100%}
.axisT{font-size:9px;fill:var(--sub)}

/* alertas */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--linea)}
.al:last-child{border-bottom:none}
.al .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.05rem;flex-shrink:0}
.al .ic.bd{background:#e9f9f0;color:var(--verde)}
.al .ic.su{background:#fdeeee;color:var(--rojo)}
.al .tt{font-weight:700;font-size:.88rem}
.al .tx{font-size:.78rem;color:var(--sub);margin-top:2px}
.al .q{margin-left:auto;font-size:.68rem;color:var(--sub);flex-shrink:0}

/* tabla favoritas */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);
  padding:8px 10px;border-bottom:1px solid var(--linea);cursor:pointer;user-select:none;
}
.tbl th.ordA::after{content:' ▲';color:var(--azul);font-size:.6rem}
.tbl th.ordD::after{content:' ▼';color:var(--azul);font-size:.6rem}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f2f5}
.tbl tr:last-child td{border-bottom:none}
.tbl tr{cursor:pointer}
.tbl tr:hover{background:#f6f9ff}
.tbl .px{font-weight:800;letter-spacing:-.4px}
.tbl .dr{color:var(--sub);font-size:.78rem}
.lm{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:.68rem;vertical-align:middle;margin-right:8px}

/* IA */
.iaS{font-size:.86rem;line-height:1.55;margin:0}
.iaS ul{margin:6px 0;padding-left:17px}
.iaS p{margin:6px 0}
.iaS blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--azul);background:#f2f7ff;border-radius:8px;font-size:.78rem;color:var(--sub)}
.iaM{max-width:88%;padding:11px 13px;border-radius:14px;background:#eef4ff;font-size:.86rem}
.iaMeta{font-size:.68rem;color:var(--sub);margin-bottom:6px;font-weight:600}
.iahint{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.iahint .ch{border:1px solid var(--linea);border-radius:999px;background:#fff;padding:7px 12px;font-size:.78rem;font-weight:700;cursor:pointer}

/* móvil */
.mtbs{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;background:var(--panel);border-top:1px solid var(--linea);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.mtbs button{flex:1;border:none;background:none;font-size:.68rem;font-weight:700;color:var(--sub);padding:6px 0;cursor:pointer}
.mtbs button.act{color:var(--azul)}
@media (max-width:980px){
  .mtbs{display:flex}
  .cont{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
}
.secpane{display:none}
.secpane.act{display:flex}

.snk{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:99;
  background:#15202b;color:#fff;font-size:.8rem;padding:9px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.snk-vis{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <span class="lg"><i>📊</i> <b class="lgT">Torre de control</b></span>
  <select id="selProv"></select>
  <select id="selComb"></select>
  <div class="esp"></div>
  <span style="font-size:.75rem;color:var(--sub)" id="hoyTxt"></span>
  <button class="b" id="bPush">🔔 Avisos</button>
  <button class="b pr" id="bLista">Vista lista →</button>
</header>

<div class="cont">
  <!-- RESUMEN -->
  <div class="secpane act" data-pane="resumen" style="flex-direction:column">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="tarj">
        <h3>📈 Evolución del precio</h3>
        <div class="st" id="chSt">—</div>
        <div class="legend" id="legend"></div>
        <div id="chartZone"></div>
      </div>
      <div class="tarj">
        <h3>🔔 Alertas recientes</h3>
        <div class="st">Ejemplo de avisos push que estarían activos</div>
        <div id="zonaAl"></div>
        <button class="b" style="width:100%;margin-top:10px;border:1px dashed var(--linea);background:#fafbfd;border-radius:12px;padding:11px;font-weight:700;font-size:.8rem;cursor:pointer" id="bVerTodas">Ver todas (maqueta)</button>
      </div>
    </div>
  </div>

  <!-- FAVORITAS/TABLA -->
  <div class="secpane" data-pane="favoritas" style="flex-direction:column">
    <div class="tarj">
      <h3>⭐ Mis estaciones vigiladas</h3>
      <div class="st" id="tblSt"></div>
      <table class="tbl" id="tblF"></table>
    </div>
  </div>

  <!-- IA -->
  <div class="secpane" data-pane="ia" style="flex-direction:column">
    <div class="tarj">
      <h3>✨ Resumen del asistente</h3>
      <div class="st">Pregunta a todos los proveedores como en la pestaña General de la app</div>
      <div class="iahint" id="iah"></div>
      <div class="iaM" id="iaBox"></div>
    </div>
  </div>
</div>

<nav class="mtbs">
  <button data-v="resumen" class="act"><span style="display:block;font-size:1.1rem">📊</span>Resumen</button>
  <button data-v="favoritas"><span style="display:block;font-size:1.1rem">⭐</span>Favoritas</button>
  <button data-v="ia"><span style="display:block;font-size:1.1rem">✨</span>IA</button>
</nav>
<div class="snk" id="snk"></div>

<script src="../_lib/mock.js"></script>
<script>
(function(){
'use strict';
var ST={prov:'Madrid',comb:'Gasolina 95 E5',vist:'resumen',rang:30,dia:'2026-10-16',ord:'asc'};
function snack(m){var s=document.getElementById('snk');s.textContent=m;s.classList.add('snk-vis');
  clearTimeout(s._t);s._t=setTimeout(function(){s.classList.remove('snk-vis')},2400)}

document.getElementById('hoyTxt').textContent='datos cerrados hoy · Ministerio';
document.getElementById('selProv').innerHTML=GLM.PROVINCIAS.map(function(p){return '<option'+(p===ST.prov?' selected':'')+'>'+p+'</option>'}).join('');
document.getElementById('selComb').innerHTML=GLM.COMBUSTIBLES.slice(0,5).map(function(c){return '<option'+(c===ST.comb?' selected':'')+'>'+c+'</option>'}).join('');
document.getElementById('selProv').addEventListener('change',function(){ST.prov=this.value;renderAll()});
document.getElementById('selComb').addEventListener('change',function(){ST.comb=this.value;renderAll()});

/* ---- series elegidas: favoritas + 2 más baratas ---- */
function seriesAct(){
  var l=GLM.de(ST.prov).filter(function(e){return e.precios[ST.comb]!=null});
  var fav=l.filter(function(e){return e.fav}).slice(0,3);
  l.sort(function(a,b){return GLM.precioFinal(a,ST.comb)-GLM.precioFinal(b,ST.comb)});
  var baratas=l.slice(0,2);
  var out=[];var usado={};
  fav.concat(baratas).forEach(function(e){
    if(usado[e.id])return;usado[e.id]=1;
    out.push(e);
  });
  return out.slice(0,5);
}
var PALETA=['#0b6ef0','#c62828','#0a8a3c','#b26a00','#7c3aed'];

/* ---- KPIs ---- */
function kpis(){
  var l=GLM.de(ST.prov).filter(function(e){return e.precios[ST.comb]!=null});
  var media=l.reduce(function(t,e){return t+GLM.precioFinal(e,ST.comb)},0)/l.length;
  l.sort(function(a,b){return GLM.precioFinal(a,ST.comb)-GLM.precioFinal(b,ST.comb)});
  var top=l[0];
  var ser=GLM.historico(top,ST.comb,30),r=GLM.resumen(ser);
  var media7=ser.slice(-7).reduce(function(t,s){return t+s.p},0)/7,
      media30=ser.slice(-30).reduce(function(t,s){return t+s.p},0)/30;
  var deltaProv=media7-media30;
  var nfav=l.filter(function(e){return e.fav}).length;
  document.getElementById('kpis').innerHTML=
   '<div class="kpi"><span class="e">Media '+GLM.COMBUSTIBLES_CORTOS[ST.comb]+' · '+ST.prov+'</span>'+
    '<div class="v">'+GLM.fmt(media)+' <small>€/L</small></div><div class="x">semáforo entre '+l.length+' estaciones</div></div>'+
    '<div class="kpi"><span class="e">Tendencia 30 días</span><div class="v" style="color:'+(deltaProv<0?'var(--verde)':'var(--rojo)')+'">'+
    (deltaProv<0?'▼ ':'▲ ')+GLM.fmt(Math.abs(deltaProv))+'</div><div class="x">media 7d vs media 30d de la más barata</div></div>'+
    '<div class="kpi"><span class="e">Mejor estación hoy</span><div class="v mr"><span class="lm" style="background:'+GLM.colorMarca(top.marca)+'">'+top.marca.slice(0,2)+'</span>'+
    GLM.fmt(GLM.precioFinal(top,ST.comb))+' <small>€/L</small></div><div class="x">'+top.marca+' · '+top.localidad+' · '+GLM.fmt2(top.dist)+' km</div></div>'+
    '<div class="kpi"><span class="e">Vigiladas ⭐</span><div class="v">'+nfav+'</div>'+
    '<div class="x">con aviso si bajan en 14 días</div></div>';
}

/* ---- gráfica comparada multi-serie ---- */
var on={};
function drawChart(){
  var series=seriesAct();
  if(!series.length){document.getElementById('chartZone').innerHTML='<p style="color:var(--sub)">Sin datos.</p>';return;}
  var w=document.getElementById('chartZone').clientWidth||640,h=300;
  var ulti=series.map(function(e){return GLM.historico(e,ST.comb,ST.rang)});
  var lo=1e9,hi=-1e9;
  ulti.forEach(function(s){s.forEach(function(p){lo=Math.min(lo,p.p);hi=Math.max(hi,p.p)})});
  var lo2=Math.max(0.4,lo-0.012*Math.max(1,hi-lo)),hi2=hi+0.012*Math.max(1,hi-lo);
  var span=hi2-lo2;
  var padL=52,padR=14,padT=12,padB=26;
  var g3=5;
  var gr='';
  for(var j=0;j<=g3;j++){
    var v=hi2-j/g3*span,y=padT+j/g3*(h-padT-padB);
    gr+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f4"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" class="axisT">'+v.toFixed(3).replace('.', ',')+'</text>';
  }
  var nmax=Math.max.apply(null,ulti.map(function(s){return s.length}));
  var paths='',lbl='';
  ulti.forEach(function(s,si){
    var e=series[si];
    var col=PALETA[si%PALETA.length];
    var d='';
    s.forEach(function(p,i){
      var x=padL+i/(s.length-1)*(w-padL-padR),y=padT+(1-(p.p-lo2)/span)*(h-padT-padB);
      d+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
    });
    var op=on[e.id]===false?0.15:0.95;
    paths+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" opacity="'+op+'" data-ser="'+e.id+'"/>';
  });
  var paso=Math.max(1,Math.floor(nmax/4));
  var primer=ulti[0];
  for(var k=0;k<nmax;k+=paso){
    var xx=padL+k/(nmax-1)*(w-padL-padR);
    var ff=primer[Math.min(primer.length-1,k)];
    lbl+='<text x="'+xx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" class="axisT">'+(ff?ff.f.slice(0,-5):'')+'</text>';
  }
  document.getElementById('chartZone').innerHTML='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+gr+paths+lbl+'</svg>';
  document.getElementById('chSt').textContent=ST.comb+' · '+ST.prov+' · '+ST.rang+' días. '+
    'Un día sin precio publicado no significa precio constante: las series tienen huecos como en la app real.';
  document.getElementById('legend').innerHTML=series.map(function(e,i){
    var col=PALETA[i%PALETA.length];
    return '<button class="leg'+(on[e.id]===false?' off':'')+'" data-tg="'+e.id+'">'+
      '<span class="sw" style="background:'+col+'"></span>'+e.marca+' · '+GLM.fmt(GLM.precioFinal(e,ST.comb))+'</button>';
  }).join('');
}
document.getElementById('legend').addEventListener('click',function(e){
  var b=e.target.closest('[data-tg]');if(!b)return;
  var id=b.dataset.tg;on[id]=on[id]===false?true:false;drawChart();
});

/* ---- alertas ---- */
function alertasZ(){
  document.getElementById('zonaAl').innerHTML=GLM.alertasPush.map(function(a){
    var bd=a.tipo==='caida';
    return '<div class="al"><div class="ic '+(bd?'bd':'su')+'">'+(bd?'▼ ':'▲ ')+'</div>'+
      '<div><div class="tt">'+a.est+'</div><div class="tx">'+a.txt+'</div></div><span class="q">'+a.hora+'</span></div>';
  }).join('');
}

/* ---- favoritas tabla ---- */
function tablaF(){
  var l=GLM.de(ST.prov).filter(function(e){return e.fav});
  var list=l.slice().sort(function(a,b){return GLM.precioFinal(a,ST.comb)-GLM.precioFinal(b,ST.comb)});
  var media=GLM.de(ST.prov).filter(function(e){return e.precios[ST.comb]!=null})
    .reduce(function(t,e){return t+GLM.precioFinal(e,ST.comb)},0)/(GLM.de(ST.prov).length||1);
  document.getElementById('tblSt').textContent=l.length+' estaciones · comparadas con la media provincial ('+GLM.fmt(media)+' €/L)';
  document.getElementById('tblF').innerHTML='<thead><tr>'+
    '<th>Estación</th><th'+(ST.ord==='precio'?' class="ordA"':'')+' data-ord="precio">Precio</th>'+
    '<th data-ord="delta">Variación hoy</th><th>Media 30d</th></tr></thead><tbody>'+
    list.map(function(e){
      var s=GLM.historico(e,ST.comb,30),r=GLM.resumen(s);
      var p=GLM.precioFinal(e,ST.comb),dif=p-media;
      var t=GLM.tendencia(e,ST.comb);
      return '<tr data-abre="'+e.id+'">'+
        '<td><span class="lm" style="background:'+GLM.colorMarca(e.marca)+'">'+e.marca.slice(0,2)+'</span>'+e.marca+
        '<div class="dr">'+e.direccion+' · '+e.localidad+'</div></td>'+
        '<td class="px nivel-'+GLM.nivel(p)+'">'+GLM.fmt(p)+'<div class="dr" style="'+(dif<0?'color:var(--verde)':'color:var(--rojo)')+'">'+
        (dif<0?'−':'+')+GLM.fmt(Math.abs(dif))+' vs media</div></td>'+
        '<td style="color:'+(t.d<0?'var(--verde)':'var(--rojo)')+';font-weight:700">'+(t.d<0?'▼':'▲')+' '+GLM.fmt(Math.abs(t.d))+' ('+Math.abs(t.pct)+'%)</td>'+
        '<td>'+GLM.fmt(r.media)+' €/L</td></tr>';
    }).join('')+'</tbody>';
}
document.getElementById('tblF').addEventListener('click',function(e){
  var th=e.target.closest('[data-ord]');
  if(th){ST.ord=ST.ord==='precio'?'—':'precio';tablaF();return}
  var tr=e.target.closest('[data-abre]');if(tr)snack('En la app real abre la ficha con histórico, sin salir de la analítica.');
});

/* ---- IA resumen ---- */
function iaResumenGen(){
  var l=GLM.de(ST.prov).filter(function(e){return e.precios[ST.comb]!=null});
  var txt=GLM.chatRespuesta('¿Cuál es la más barata?',l,ST.comb);
  document.getElementById('iaBox').innerHTML='<div class="iaMeta">✨ IA · '+(GLM.PROVINCIAS.indexOf(ST.prov)+1)+
    ' de tus pestañas · 1,3 s</div>'+GLM.md(txt);
}
document.getElementById('iah').innerHTML=GLM.PROMPTS.map(function(p){return '<button class="ch">'+p+'</button>'}).join('');
document.getElementById('iah').addEventListener('click',function(e){
  if(e.target.classList.contains('ch')){
    var l=GLM.de(ST.prov).filter(function(e){return e.precios[ST.comb]!=null});
    document.getElementById('iaBox').innerHTML='<div class="iaMeta">✨ IA · respuesta · 1,4 s</div>'+GLM.md(GLM.chatRespuesta(e.target.textContent,l,ST.comb));
  }
});

/* ---- arriba ---- */
document.getElementById('bLista').addEventListener('click',function(){snack('En la app real saltarías a la vista lista/mapa con esta selección mantenida')});
document.getElementById('bPush').addEventListener('click',function(){snack('🔔 Config de avisos (intervalo, días, probar) en la pestaña Ajustes')});
document.getElementById('bVerTodas').addEventListener('click',function(){snack('Maqueta: registro completo de push en Config → Registro')});

/* nav móvil */
document.querySelector('.mtbs').addEventListener('click',function(e){
  var b=e.target.closest('[data-v]');if(!b)return;
  ST.vist=b.dataset.v;
  document.querySelectorAll('.mtbs button').forEach(function(x){x.classList.toggle('act',x===b)});
  document.querySelectorAll('.secpane').forEach(function(p){p.classList.toggle('act',p.dataset.pane===ST.vist)});
  if(ST.vist==='favoritas')tablaF();
});

function renderAll(){kpis();drawChart();alertasZ();tablaF();iaResumenGen()}
window.addEventListener('resize',drawChart);
renderAll();
window.PT_VALID='v07';
})();
</script>
</body>
</html>
