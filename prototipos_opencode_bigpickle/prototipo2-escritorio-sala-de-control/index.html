<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gasolineras · Sala de control — prototipo de escritorio</title>
<!-- Un único CSS propio: cero recursos externos (ni CDN ni fuentes web). -->
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!--
  Sprite de iconos SVG inline. Se usan con <svg class="icono"><use href="#i-x"></svg>.
  fill/stroke se heredan desde el <svg> que los usa (ver .icono en estilo.css),
  así que aquí no hace falta atributo de presentación.
-->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol>
  <symbol id="i-estrella" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
  <symbol id="i-campana" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10.2 20a2 2 0 0 0 3.6 0"/></symbol>
  <symbol id="i-ubicacion" viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="i-refrescar" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6z"/><path d="M9 3v15M15 6v15"/></symbol>
  <symbol id="i-tabla" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9.5h18M9 9.5v10"/></symbol>
  <symbol id="i-dual" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></symbol>
  <symbol id="i-ia" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-config" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
  <symbol id="i-filtro" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-ruta" viewBox="0 0 24 24"><path d="M12 3 20 21l-8-4-8 4z"/><path d="M12 3v14"/></symbol>
  <symbol id="i-compartir" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.3 10.8 15.7 6.2M8.3 13.2l7.4 4.6"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-diana" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6"/></symbol>
  <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-tendencia" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M16 7h5v5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.4v.8"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</svg>

<div class="app">

  <!-- ============================ CABECERA ============================ -->
  <header class="cabecera">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true"><svg class="icono icono-20"><use href="#i-rayo"/></svg></span>
      <span class="marca-txt">
        <strong>Gasolineras</strong>
        <small>Sala de control</small>
      </span>
    </div>

    <!-- Buscador global: siempre visible, con sugerencias -->
    <div class="buscador" id="buscadorCaja">
      <span class="buscador-icono" aria-hidden="true"><svg class="icono"><use href="#i-lupa"/></svg></span>
      <input id="buscador" type="text" role="searchbox" autocomplete="off" spellcheck="false"
             placeholder="Busca estación, localidad o marca…  ( tecla / )"
             aria-label="Buscador global de estaciones"
             aria-expanded="false" aria-controls="sugerencias">
      <button class="buscador-limpiar" type="button" data-accion="limpiar-busqueda"
              aria-label="Limpiar la búsqueda" hidden>✕</button>
      <div class="sugerencias" id="sugerencias" role="listbox" aria-label="Sugerencias de búsqueda" hidden></div>
    </div>

    <!-- Filtros principales como chips desplegables -->
    <div class="chips">
      <button class="chip" type="button" data-accion="desplegable" data-desplegable="provincia"
              aria-haspopup="dialog" aria-expanded="false" id="chipProvincia">
        <span class="chip-et">Provincia</span>
        <span class="chip-val" id="chipProvinciaVal">—</span>
        <svg class="icono icono-12 chip-flecha" aria-hidden="true"><use href="#i-flecha"/></svg>
      </button>
      <button class="chip" type="button" data-accion="desplegable" data-desplegable="combustible"
              aria-haspopup="dialog" aria-expanded="false" id="chipCombustible">
        <span class="chip-et">Combustible</span>
        <span class="chip-val" id="chipCombVal">—</span>
        <svg class="icono icono-12 chip-flecha" aria-hidden="true"><use href="#i-flecha"/></svg>
      </button>
      <button class="chip chip-filtros" type="button" data-accion="desplegable" data-desplegable="filtros"
              aria-haspopup="dialog" aria-expanded="false" id="chipFiltros">
        <svg class="icono icono-14" aria-hidden="true"><use href="#i-filtro"/></svg>
        <span class="chip-val">Filtros</span>
        <span class="chip-badge" id="filtrosNum" hidden>0</span>
      </button>
    </div>

    <!-- Leyenda de precios (misma semántica que FAKE.colorPrecio) -->
    <div class="leyenda" id="leyenda" aria-label="Leyenda de colores de precio">
      <span><i class="punto punto-verde"></i>&lt; 1,50 €</span>
      <span><i class="punto punto-naranja"></i>1,50–1,70 €</span>
      <span><i class="punto punto-rojo"></i>&gt; 1,70 €</span>
    </div>

    <div class="acciones">
      <button class="icono-btn" type="button" data-accion="geolocalizar" aria-label="Centrar en mi ubicación"
              title="Mi ubicación"><svg class="icono"><use href="#i-ubicacion"/></svg></button>
      <button class="icono-btn" type="button" id="btnFavoritos" data-accion="solo-favoritos"
              aria-pressed="false" aria-label="Ver solo favoritas" title="Solo favoritas">
        <svg class="icono"><use href="#i-estrella"/></svg>
        <span class="icono-btn-badge" id="favNum">0</span>
      </button>
      <button class="icono-btn" type="button" id="btnPush" data-accion="desplegable" data-desplegable="push"
              aria-haspopup="dialog" aria-expanded="false" aria-label="Notificaciones push" title="Notificaciones">
        <svg class="icono"><use href="#i-campana"/></svg>
        <span class="icono-btn-punto" id="pushPunto" hidden aria-hidden="true"></span>
      </button>
      <button class="icono-btn" type="button" data-accion="refrescar" aria-label="Refrescar datos"
              title="Refrescar datos"><svg class="icono"><use href="#i-refrescar"/></svg></button>
      <span class="actualizado" id="actualizado">—</span>
    </div>
  </header>

  <!-- ============================= CUERPO ============================= -->
  <div class="cuerpo">

    <!-- Rail de navegación (en móvil se convierte en bottom-nav con CSS) -->
    <nav class="rail" id="rail" aria-label="Secciones de la aplicación">
      <button class="rail-btn activo" type="button" data-accion="vista" data-vista="mapa" aria-current="page">
        <svg class="icono icono-20" aria-hidden="true"><use href="#i-mapa"/></svg><span>Mapa</span>
      </button>
      <button class="rail-btn" type="button" data-accion="vista" data-vista="datos" data-shot="vista">
        <svg class="icono icono-20" aria-hidden="true"><use href="#i-tabla"/></svg><span>Datos</span>
      </button>
      <button class="rail-btn" type="button" data-accion="vista" data-vista="dual">
        <svg class="icono icono-20" aria-hidden="true"><use href="#i-dual"/></svg><span>Comparar</span>
      </button>
      <button class="rail-btn" type="button" data-accion="vista" data-vista="ia">
        <svg class="icono icono-20" aria-hidden="true"><use href="#i-ia"/></svg><span>IA</span>
      </button>
      <button class="rail-btn" type="button" data-accion="vista" data-vista="config">
        <svg class="icono icono-20" aria-hidden="true"><use href="#i-config"/></svg><span>Config</span>
      </button>
    </nav>

    <div class="escenario" id="escenario" data-vista="mapa">

      <!-- ------------------ Vista central: mapa + tabla ------------------ -->
      <section class="vista-datos-mapa" aria-label="Mapa y tabla de estaciones">

        <div class="mapa-caja" data-estilo="satelite" id="mapaCaja">
          <div class="mapa-lienzo" id="mapaLienzo">
            <div class="mapa-mundo" id="mapaMundo">
              <!-- El "mapa" es un SVG generado desde FAKE.mapa (viales, manchas, agua) -->
              <svg class="mapa-svg" id="mapaSvg" viewBox="0 0 100 100" preserveAspectRatio="none"
                   aria-hidden="true" focusable="false"></svg>
              <div class="mapa-marcadores" id="mapaMarcadores"></div>
            </div>
            <div class="mapa-vacio" id="mapaVacio" hidden>
              <strong>Sin resultados</strong>
              <span>Prueba a quitar algún filtro o ampliar la distancia.</span>
            </div>
            <div class="capa-cargando" id="mapaCargando">Cargando precios…</div>
          </div>

          <div class="mapa-barra">
            <label class="sr-solo" for="mapaEstilo">Estilo del mapa</label>
            <select id="mapaEstilo" class="select-mini">
              <option value="satelite" selected>Satélite</option>
              <option value="calle">Calle</option>
              <option value="oscuro">Oscuro</option>
              <option value="topografico">Topográfico</option>
            </select>
            <div class="mapa-zoom">
              <button type="button" data-accion="zoom" data-paso="1" aria-label="Acercar"><svg class="icono icono-14"><use href="#i-mas"/></svg></button>
              <button type="button" data-accion="zoom" data-paso="-1" aria-label="Alejar"><svg class="icono icono-14"><use href="#i-menos"/></svg></button>
              <button type="button" data-accion="zoom" data-paso="0" aria-label="Centrar el mapa"><svg class="icono icono-14"><use href="#i-diana"/></svg></button>
            </div>
          </div>

          <!-- Tarjeta flotante de resumen -->
          <div class="resumen-mapa" id="resumenMapa"></div>
        </div>

        <div class="tabla-caja">
          <div class="tabla-cab">
            <h2 class="titulo-bloque">Datos <span class="cuenta" id="tablaCuenta">0</span></h2>
            <p class="pista-teclado">
              <kbd>↑</kbd><kbd>↓</kbd> mover · <kbd>Enter</kbd> abrir detalle · <kbd>/</kbd> buscar
            </p>
          </div>
          <div class="tabla-scroll" id="tablaScroll"></div>
        </div>
      </section>

      <!-- ---------------------------- Vista IA ---------------------------- -->
      <section class="vista-ia" aria-label="Chat con IA">
        <div class="ia-caja">
          <div class="ia-tabs" id="iaTabs" role="tablist" aria-label="Proveedores de IA"></div>
          <div class="ia-barra" id="iaBarra"></div>
          <div class="ia-mensajes" id="iaMensajes" aria-live="polite"></div>
          <form class="ia-envio" id="iaForm">
            <label class="sr-solo" for="iaInput">Mensaje para la IA</label>
            <input id="iaInput" type="text" autocomplete="off" placeholder="Pregunta lo que quieras sobre los precios…">
            <button type="submit" class="btn-primario">Enviar</button>
          </form>
        </div>
      </section>

      <!-- -------------------------- Vista Config -------------------------- -->
      <section class="vista-config" aria-label="Configuración">
        <div class="config-grid" id="configGrid"></div>
      </section>

      <!-- ----------------- Panel derecho: lista de tarjetas -------------- -->
      <aside class="panel-lista" id="panelLista" aria-label="Listado de estaciones">
        <div class="panel-asa" data-accion="alternar-lista" role="button" tabindex="0"
             aria-label="Expandir o contraer el listado de estaciones">
          <span class="asa-barra" aria-hidden="true"></span>
          <span class="asa-texto" id="asaTexto">Listado</span>
        </div>
        <div class="panel-cab">
          <h2 class="titulo-bloque">Estaciones <span class="cuenta" id="listaCuenta">0</span></h2>
          <div class="panel-cab-acciones">
            <label class="sr-solo" for="ordenLista">Ordenar el listado</label>
            <select id="ordenLista" class="select-mini">
              <option value="precio-asc">Más baratas</option>
              <option value="precio-desc">Más caras</option>
              <option value="dist">Más cercanas</option>
              <option value="localidad">Localidad (A-Z)</option>
              <option value="marca">Marca (A-Z)</option>
            </select>
          </div>
        </div>
        <div class="panel-cuerpo" id="listaCuerpo"></div>
      </aside>

      <!-- --------------- Tercer panel plegable: detalle ------------------ -->
      <aside class="panel-detalle" id="panelDetalle" aria-label="Detalle de la estación" hidden>
        <div class="detalle-cab">
          <button class="icono-btn icono-btn-mini" type="button" data-accion="cerrar-detalle"
                  aria-label="Cerrar el detalle"><svg class="icono"><use href="#i-cerrar"/></svg></button>
          <div class="detalle-titulos">
            <h2 id="detalleNombre">—</h2>
            <p id="detalleDir">—</p>
          </div>
        </div>
        <div class="detalle-precio" id="detallePrecio"></div>
        <div class="detalle-acciones" id="detalleAcciones"></div>
        <div class="detalle-tabs" role="tablist" aria-label="Secciones del detalle">
          <button class="detalle-tab activo" type="button" role="tab" id="tabDetalleInfo"
                  data-accion="detalle-tab" data-tab="info" aria-selected="true">Información</button>
          <button class="detalle-tab" type="button" role="tab" id="tabDetalleHist"
                  data-accion="detalle-tab" data-tab="historico" aria-selected="false">Histórico</button>
        </div>
        <div class="detalle-cuerpo">
          <div class="detalle-panel activo" id="detallePanelInfo" role="tabpanel" aria-labelledby="tabDetalleInfo"></div>
          <div class="detalle-panel" id="detallePanelHist" role="tabpanel" aria-labelledby="tabDetalleHist"></div>
        </div>
      </aside>

    </div>
  </div>

  <!-- ========================== BARRA DE ESTADO ======================== -->
  <footer class="barra-estado">
    <span class="estado-item" id="infoEstaciones">—</span>
    <span class="estado-sep" aria-hidden="true"></span>
    <span class="estado-item" id="infoMedia">—</span>
    <span class="estado-sep" aria-hidden="true"></span>
    <span class="estado-item estado-barata" id="infoBarata">—</span>
    <div class="paginacion" id="paginacion">
      <button type="button" id="prevPage" data-accion="pagina" data-paso="-1" aria-label="Página anterior">◀</button>
      <span id="pageInfo" aria-live="polite">1 / 1</span>
      <button type="button" id="nextPage" data-accion="pagina" data-paso="1" aria-label="Página siguiente">▶</button>
    </div>
  </footer>

  <!-- Panel flotante reutilizable (chips, filtros, push) -->
  <div class="desplegable" id="desplegable" role="dialog" aria-modal="false" hidden></div>
  <!-- Avisos efímeros -->
  <div class="avisos" id="avisos" aria-live="polite" aria-atomic="false"></div>
</div>

<script src="../shared/datos-fake.js"></script>
<script src="app.js"></script>
</body>
</html>
