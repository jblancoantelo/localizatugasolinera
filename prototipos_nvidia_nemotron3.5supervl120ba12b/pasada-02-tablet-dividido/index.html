<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prototipo 2 · Tablet Dividido · Gasolineras</title>
<link rel="preload" as="script" href="../datos-fake.js">
<script src="../datos-fake.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f4f6f9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 12px;
  --touch: 44px;
}
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100vh; position: relative; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.topbar .title { font-weight: 700; font-size: 1rem; flex: 1; min-width: 140px; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }

/* Shell: sidebar + main */
.shell { display: flex; flex: 1; overflow: hidden; position: relative; }
.sidebar { width: 340px; min-width: 260px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; transition: width 0.25s; z-index: 40; }
.sidebar.collapsed { width: 64px; min-width: 64px; }
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.map-wrap { flex: 1; position: relative; background: #dbeafe; overflow: hidden; }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
.map-layer { position: absolute; inset: 0; pointer-events: none; }

/* Collapse toggle */
.collapse-btn { position: absolute; top: 0.5rem; left: 0; width: 32px; height: 32px; border-radius: 0 24px 24px 0; background: #fff; border: 1px solid var(--line); border-left: none; cursor: pointer; display: grid; place-items: center; font-size: 0.9rem; color: var(--muted); z-index: 45; box-shadow: 2px 2px 6px rgba(0,0,0,0.08); }
.collapse-btn.collapsed { left: auto; right: 0; border-radius: 24px 0 0 24px; border-left: 1px solid var(--line); border-right: none; }

/* Sidebar content */
.sidebar-inner { overflow-y: auto; padding: 0.75rem; flex: 1; }
.sidebar.collapsed .sidebar-inner { display: none; }
.section-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0.75rem 0 0.4rem; display: flex; justify-content: space-between; align-items: center; }
.section-title .count { font-size: 0.7rem; font-weight: 400; background: #eef2ff; color: var(--brand); padding: 0 0.4rem; border-radius: 10px; }

/* Chips in sidebar */
.chip-row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 0.75rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.chip .remove { font-size: 1rem; line-height: 1; padding: 0 0.15rem; }

/* Search */
.search-wrap { padding: 0.4rem 0; display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
.search-wrap input { flex: 1; padding: 0.45rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; font-size: 0.8rem; background: #f8fafc; }
.search-wrap input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }

/* List */
.card-list { display: flex; flex-direction: column; gap: 0.45rem; }
.station-card { display: flex; align-items: center; gap: 0.6rem; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.65rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; min-height: var(--touch); }
.station-card:active { transform: scale(0.995); }
.station-card:hover { border-color: var(--brand); box-shadow: 0 4px 14px rgba(26,115,232,0.1); }
.station-card.selected { border-color: var(--brand); background: #eef6ff; }
.station-card .rank { width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.station-card .rank.best { background: var(--green); color: #fff; }
.station-card .info { flex: 1; min-width: 0; }
.station-card .name { font-weight: 700; font-size: 0.82rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-card .addr { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
.station-card .price { font-weight: 800; font-size: 0.95rem; color: var(--text); }
.station-card .price .uni { font-size: 0.6rem; color: var(--muted); font-weight: 600; }
.station-card .dist { font-size: 0.68rem; color: var(--muted); background: #f1f5f9; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid #cbd5e1; }
.station-card .fav { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 0.95rem; color: #b0b0b0; flex-shrink: 0; }
.station-card .fav.on { color: #f9a825; border-color: #f9a825; background: #fff7e0; }

/* Legend */
.legend { display: flex; gap: 0.4rem; justify-content: center; margin: 0.4rem 0; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 0.25rem; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; }

/* Empty */
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }
.empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty h3 { font-size: 1rem; margin-bottom: 0.3rem; color: var(--text); }

/* Detail panel (sidebar, tablet) */
.detail-panel { border-top: 1px solid var(--line); padding: 0.75rem; overflow-y: auto; }
.detail-panel h2 { font-size: 0.95rem; margin-bottom: 0.5rem; font-weight: 700; }
.detail-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.8rem; }
.detail-row .label { color: var(--muted); }
.detail-row .value { font-weight: 600; }
.detail-actions { padding-top: 0.5rem; display: flex; gap: 0.4rem; }
.detail-btn { flex: 1; padding: 0.45rem; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; font-size: 0.78rem; }
.detail-btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.detail-btn.fav { width: 44px; }

/* Desktop-only switch */
@media (min-width: 1024px) {
  .shell { flex-direction: row; }
  .sidebar.collapsed { width: 280px; min-width: 260px; }
  .sidebar.collapsed .sidebar-inner { display: block; }
  .collapse-btn { display: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="btnToggleSidebar" title="Filtros">🔧</button>
    <div class="title" id="headerTitle">Selecciona provincia</div>
    <div style="display:flex;gap:0.3rem;">
      <button class="icon-btn" id="btnGeo" title="Mi ubicación">📍</button>
      <button class="icon-btn" id="btnListView" title="Solo lista">📋</button>
      <button class="icon-btn" id="btnMapView" title="Solo mapa">🗺️</button>
    </div>
  </header>

  <div class="shell" id="shell">
    <button class="collapse-btn" id="btnCollapse" title="Ocultar filtros">◀</button>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner" id="sidebarInner">
        <div class="section-title">Provincia <span class="count" id="cntProv">0</span></div>
        <div class="chip-row" id="chipProv"></div>
        <div class="section-title">Combustible <span class="count" id="cntComb">0</span></div>
        <div class="chip-row" id="chipComb"></div>
        <div class="section-title">Marca <span class="count" id="cntMarca">0</span></div>
        <div class="chip-row" id="chipMarca"></div>
        <div class="section-title">Filtros rápidos <span class="count" id="cntFav">0</span></div>
        <div class="chip-row" id="chipFav"></div>
        <div class="search-wrap">
          <input type="text" id="inpSearch" placeholder="Buscar estación…">
        </div>
        <div class="legend" id="legend"></div>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:0.3rem;">${null} estaciones</div>
        <div id="countText" style="font-size:0.7rem;color:var(--muted);margin-top:0.3rem;"></div>
        <div class="card-list" id="list"></div>
        <div class="detail-panel" id="detailPanel"></div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="map-wrap" id="mapWrap">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
      </div>
    </main>
  </div>
</div>
<script>
const STATE = {
  prov: null,
  combustible: '',
  marca: '',
  buscar: '',
  soloFav: false,
  view: 'both',
  orden: 'precio',
  asc: true,
  seleccionada: null,
};
const COMB = 'Precio Gasolina 95 E5';

const els = {
  shell: document.getElementById('shell'),
  sidebar: document.getElementById('sidebar'),
  btnCollapse: document.getElementById('btnCollapse'),
  btnToggleSidebar: document.getElementById('btnToggleSidebar'),
  chipProv: document.getElementById('chipProv'),
  chipComb: document.getElementById('chipComb'),
  chipMarca: document.getElementById('chipMarca'),
  chipFav: document.getElementById('chipFav'),
  inpSearch: document.getElementById('inpSearch'),
  list: document.getElementById('list'),
  detailPanel: document.getElementById('detailPanel'),
  mapLayer: document.getElementById('mapLayer'),
  headerTitle: document.getElementById('headerTitle'),
  cntProv: document.getElementById('cntProv'),
  countText: document.getElementById('countText'),
  btnListView: document.getElementById('btnListView'),
  btnMapView: document.getElementById('btnMapView'),
};

function chip(label, active, onClick, removeLabel) {
  const c = document.createElement('button');
  c.className = 'chip ' + (active ? 'active' : '');
  c.innerHTML = label + (removeLabel ? ' <span class="remove">✕</span>' : '');
  if (onClick) c.onclick = (e) => { e.stopPropagation(); onClick(); };
  if (removeLabel) c.querySelector('.remove').onclick = (e) => { e.stopPropagation(); onClick(); };
  return c;
}

function renderChips() {
  [els.chipProv, els.chipComb, els.chipMarca, els.chipFav].forEach(el => el.innerHTML = '');
  if (STATE.prov) {
    const p = PROVINCIAS.find(x => x.id === STATE.prov);
    els.chipProv.appendChild(chip(p.nombre, true, () => setProv(null)));
  } else {
    PROVINCIAS.forEach(p => els.chipProv.appendChild(chip(p.nombre, false, () => setProv(p.id))));
  }
  ['Precio Gasolina 95 E5','Precio Gasolina 98 E5','Precio Gasoleo A','Precio Gasoleo Premium','Precio Gases licuados del petróleo'].forEach(c => {
    const nombre = c.replace('Precio ','').replace('Gases licuados del petróleo','GLP');
    els.chipComb.appendChild(chip(nombre, STATE.combustible === c, () => setComb(STATE.combustible === c ? '' : c)));
  });
  MARCAS.forEach(m => els.chipMarca.appendChild(chip(m.nombre, STATE.marca === m.nombre, () => setMarca(STATE.marca === m.nombre ? '' : m.nombre))));
  els.chipFav.appendChild(chip('⭐ Solo favoritos', STATE.soloFav, () => setFav(!STATE.soloFav)));
}

function setProv(v) { STATE.prov = v; STATE.seleccionada = null; renderChips(); render(); }
function setComb(v) { STATE.combustible = v; renderChips(); render(); }
function setMarca(v) { STATE.marca = v; renderChips(); render(); }
function setFav(v) { STATE.soloFav = v; renderChips(); render(); }

function listaFiltrada() {
  const base = STATE.prov ? ESTACIONES.porProvincia(STATE.prov) : ESTACIONES;
  return filtrarEstaciones(base, { provincia: STATE.prov, combustible: STATE.combustible, marca: STATE.marca, buscar: STATE.buscar, soloFavoritos: STATE.soloFav });
}

function precioColor(est) {
  const p = est.precios[COMB] || 0;
  return p <= 1.45 ? 'green' : p <= 1.60 ? 'orange' : 'red';
}

function render() {
  if (!STATE.prov) {
    els.headerTitle.textContent = 'Selecciona provincia';
    els.cntProv.textContent = '0';
    els.countText.textContent = '';
    els.list.innerHTML = '<div class="empty"><div class="icon">🗺️</div><h3>Elige una provincia</h3></div>';
    els.detailPanel.innerHTML = '';
    els.mapLayer.innerHTML = '';
    return;
  }
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.headerTitle.textContent = prov.nombre;
  const lista = ordenarEstaciones(listaFiltrada(), STATE.orden, STATE.asc);
  els.cntProv.textContent = lista.length;
  els.countText.textContent = lista.length + ' estación' + (lista.length !== 1 ? 'es' : '') + ' encontrada' + (lista.length !== 1 ? 's' : '');

  const marker = (est, sel) => {
    const c = precioColor(est);
    const x = 50 + ((est.lat - prov.centro[0]) / 0.22) * 35;
    const y = 50 + ((prov.centro[1] - est.lng) / 0.22) * 35;
    return `<div class="map-marker ${c} ${sel ? 'selected' : ''}" style="left:${Math.max(5,Math.min(95,x))}%;top:${Math.max(5,Math.min(95,y))}%;" data-id="${est.id}" title="${est.nombre}">${est.marca[0]}</div>`;
  };
  els.mapLayer.innerHTML = lista.map(est => marker(est, est.id === STATE.seleccionada)).join('');

  els.list.innerHTML = lista.map(renderCard).join('');
  if (STATE.seleccionada) renderDetail(ESTACIONES.find(e => e.id === STATE.seleccionada));
  else els.detailPanel.innerHTML = '';
}

function renderCard(est) {
  const c = precioColor(est);
  const favCls = est.favorito ? 'on' : '';
  const best = est.esMejor ? '<div class="rank best">1</div>' : '<div class="rank">-</div>';
  return `<div class="station-card ${est.id === STATE.seleccionada ? 'selected' : ''}" data-id="${est.id}">
    ${best}
    <div class="info">
      <div class="name">${est.nombre}</div>
      <div class="addr">${est.direccion} · ${est.localidad}</div>
    </div>
    <div class="right">
      <div class="price">${formatearPrecio(est.precios[COMB] || 0)} <span class="uni">€/L</span></div>
      <div class="dist" style="color:${c === 'green' ? '#2e7d32' : c === 'orange' ? '#f57c00' : '#c62828'};">${formatearDistancia(est.distancia)}</div>
      <button class="fav ${favCls}" data-id="${est.id}">${est.favorito ? '★' : '☆'}</button>
    </div>
  </div>`;
}

function renderDetail(est) {
  const c = precioColor(est);
  const colorCss = c === 'green' ? 'var(--green)' : c === 'orange' ? 'var(--orange)' : 'var(--red)';
  const pDesc = precioConDescuento(est, COMB);
  const hist = historicoParaGrafica(est, COMB);
  const primero = hist[hist.length - 1];
  const ultimo = hist[0];
  const variacion = ultimo && primero ? ((ultimo.precio - primero.precio) / primero.precio * 100) : 0;
  els.detailPanel.innerHTML = `
    <div class="detail-row"><span class="label">Marca</span><span class="value">${est.marca}</span></div>
    <div class="detail-row"><span class="label">Dirección</span><span class="value">${est.direccion}</span></div>
    <div class="detail-row"><span class="label">Localidad</span><span class="value">${est.localidad}, ${est.provincia}</span></div>
    <div class="detail-row"><span class="label">Horario</span><span class="value">${est.horario}</span></div>
    <div class="detail-row"><span class="label">Distancia</span><span class="value">${formatearDistancia(est.distancia)}</span></div>
    <div class="detail-row"><span class="label">Precio</span><span class="value" style="color:${colorCss}">${formatearPrecio(est.precios[COMB] || 0)} €/L</span></div>
    <div class="detail-row"><span class="label">Con descuento ${est.descuento.toFixed(2)} €/L</span><span class="value">${formatearPrecio(pDesc)} €/L</span></div>
    <div class="detail-row"><span class="label">Variación 30d</span><span class="value">${variacion >= 0 ? '+' : ''}${variacion.toFixed(1)}%</span></div>
    <div class="detail-actions">
      <button class="detail-btn fav" data-id="${est.id}" data-fav="${est.favorito}">${est.favorito ? '★' : '☆'}</button>
      <button class="detail-btn primary">Ver en mapa</button>
    </div>
  `;
}

function abrirDetalle(id) {
  const est = ESTACIONES.find(e => e.id === id);
  if (!est) return;
  STATE.seleccionada = id;
  render();
}

function cerrarDetalle() {
  STATE.seleccionada = null;
  render();
}

/* Events */
els.btnCollapse.onclick = () => { els.sidebar.classList.toggle('collapsed'); els.btnCollapse.classList.toggle('collapsed'); };
els.btnToggleSidebar.onclick = () => { els.sidebar.classList.toggle('collapsed'); els.btnCollapse.classList.toggle('collapsed'); };

els.inpSearch.oninput = (e) => { STATE.buscar = e.target.value; render(); };

els.list.onclick = (e) => {
  const card = e.target.closest('.station-card');
  if (!card) return;
  const fav = e.target.closest('.fav');
  if (fav) {
    e.stopPropagation();
    const id = Number(fav.dataset.id);
    const est = ESTACIONES.find(e2 => e2.id === id);
    est.favorito = !est.favorito;
    fav.textContent = est.favorito ? '★' : '☆';
    render();
    return;
  }
  abrirDetalle(Number(card.dataset.id));
};

els.detailPanel.onclick = (e) => {
  const fav = e.target.closest('.detail-btn.fav');
  if (fav) {
    e.stopPropagation();
    const id = Number(fav.dataset.id);
    const est = ESTACIONES.find(e2 => e2.id === id);
    est.favorito = !est.favorito;
    render();
    return;
  }
};

els.mapLayer.onclick = (e) => {
  const m = e.target.closest('.map-marker');
  if (!m) return;
  abrirDetalle(Number(m.dataset.id));
};

els.btnListView.onclick = () => { els.btnListView.classList.add('active'); els.btnMapView.classList.remove('active'); };
els.btnMapView.onclick = () => { els.btnMapView.classList.add('active'); els.btnListView.classList.remove('active'); };

renderChips();
render();
</script>
</body>
</html>
