<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo 3 · Escritorio Ancho · Gasolineras</title>
<link rel="preload" as="script" href="../datos-fake.js">
<script src="../datos-fake.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f3f4f6;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --radius: 10px;
  --touch: 40px;
}
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; position: relative; }

/* Sidebar fijo (solo desktop) */
.sidebar { width: 290px; min-width: 260px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; z-index: 30; transition: transform 0.25s; }
.sidebar.hidden { transform: translateX(-100%); }
.sidebar-header { padding: 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 0.5rem; }
.sidebar-header .logo { font-size: 1.15rem; font-weight: 800; color: var(--brand); }
.sidebar-header .sub { font-size: 0.7rem; color: var(--muted); }
.sidebar-nav { display: flex; flex-direction: column; padding: 0.6rem 0.4rem; gap: 0.2rem; }
.nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.75rem; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-size: 0.85rem; color: var(--text); text-align: left; width: 100%; }
.nav-item:hover { background: #f1f3f5; }
.nav-item.active { background: #eef2ff; color: var(--brand); font-weight: 600; }
.nav-item .icon { font-size: 1.1rem; width: 24px; text-align: center; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.topbar .title { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 150px; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }

/* Workspace: map hero + right panel */
.workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
.map-hero { flex: 1; position: relative; background: #dbeafe; overflow: hidden; }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
.map-layer { position: absolute; inset: 0; pointer-events: none; }
.right-panel { width: 420px; min-width: 340px; background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; z-index: 20; }

/* Toolbar filters strip */
.filters-strip { padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); display: flex; gap: 0.5rem; align-items: center; overflow-x: auto; scrollbar-width: none; background: #fff; z-index: 35; position: sticky; top: 0; }
.filters-strip::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 0.78rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.chip .remove { font-size: 1rem; line-height: 1; padding: 0 0.15rem; }

/* Right panel content */
.panel-inner { flex: 1; overflow-y: auto; padding: 1rem; }
.section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0.8rem 0 0.4rem; display: flex; justify-content: space-between; align-items: center; }
.section-title .count { font-size: 0.72rem; font-weight: 400; background: #eef2ff; color: var(--brand); padding: 0 0.5rem; border-radius: 10px; }

.card-list { display: flex; flex-direction: column; gap: 0.4rem; }
.station-card { display: flex; align-items: center; gap: 0.6rem; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.65rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; min-height: var(--touch); }
.station-card:active { transform: scale(0.995); }
.station-card:hover { border-color: var(--brand); box-shadow: 0 4px 14px rgba(26,115,232,0.1); }
.station-card.selected { border-color: var(--brand); background: #eef6ff; }
.station-card .rank { width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.station-card .rank.best { background: var(--green); color: #fff; }
.station-card .info { flex: 1; min-width: 0; }
.station-card .name { font-weight: 700; font-size: 0.85rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-card .addr { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
.station-card .price { font-weight: 800; font-size: 0.95rem; color: var(--text); }
.station-card .price .uni { font-size: 0.6rem; color: var(--muted); font-weight: 600; }
.station-card .dist { font-size: 0.7rem; color: var(--muted); background: #f1f5f9; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid #cbd5e1; }
.station-card .fav { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 0.95rem; color: #b0b0b0; flex-shrink: 0; }
.station-card .fav.on { color: #f9a825; border-color: #f9a825; background: #fff7e0; }

.legend { display: flex; gap: 0.4rem; justify-content: center; margin: 0.4rem 0; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 0.25rem; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; }

/* Detail panel (right, desktop-wide) */
.detail-card { border-top: 1px solid var(--line); padding: 1rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
.detail-card h2 { font-size: 1rem; margin-bottom: 0.6rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; margin-bottom: 0.8rem; }
.detail-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid var(--line); font-size: 0.8rem; }
.detail-row .label { color: var(--muted); }
.detail-row .value { font-weight: 600; }
.detail-actions { margin-top: auto; padding-top: 0.6rem; display: flex; gap: 0.4rem; border-top: 1px solid var(--line); }
.detail-btn { flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
.detail-btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.detail-btn.fav { width: 44px; }

.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }
.empty .icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.4; }
.empty h3 { font-size: 1rem; margin-bottom: 0.3rem; color: var(--text); }

/* Keyboard hint */
.kbd-hint { position: absolute; bottom: 0.6rem; right: 0.6rem; font-size: 0.65rem; color: var(--muted); background: rgba(255,255,255,0.8); padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid var(--line); pointer-events: none; }

@media (max-width: 1023px) {
  .app { flex-direction: column; }
  .sidebar { position: fixed; inset: 0 0 0 auto; width: 290px; transform: translateX(-100%); z-index: 60; }
  .sidebar.hidden { transform: translateX(0); }
  .workspace { flex-direction: column; }
  .right-panel { width: 100%; height: 45vh; min-height: 260px; }
  .map-hero { height: 55vh; min-height: 300px; }
  .kbd-hint { display: none; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">⛽ Gasolineras</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="btnOpenSidebar" title="Menú">☰</button>
      <div class="title" id="headerTitle">Selecciona provincia</div>
      <div style="display:flex;gap:0.3rem;">
        <button class="icon-btn" id="btnGeo" title="Ubicación">📍</button>
        <button class="icon-btn" id="btnFavOnly" title="Solo favoritos">⭐</button>
      </div>
    </header>

    <div class="filters-strip" id="filtersStrip"></div>

    <div class="workspace" id="workspace">
      <div class="map-hero" id="mapHero">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
      </div>
      <div class="right-panel" id="rightPanel">
        <div class="panel-inner" id="panelInner"></div>
        <div class="detail-card" id="detailCard"></div>
      </div>
    </div>
    <div class="kbd-hint">1–5: ver estación · F: favoritos · ESC: limpiar</div>
  </div>
</div>
<script>
const STATE = {
  prov: null,
  combustible: '',
  marca: '',
  buscar: '',
  soloFav: false,
  orden: 'precio',
  asc: true,
  seleccionada: null,
};
const COMB = 'Precio Gasolina 95 E5';

const els = {
  sidebar: document.getElementById('sidebar'),
  btnOpenSidebar: document.getElementById('btnOpenSidebar'),
  sidebarNav: document.getElementById('sidebarNav'),
  headerTitle: document.getElementById('headerTitle'),
  filtersStrip: document.getElementById('filtersStrip'),
  mapLayer: document.getElementById('mapLayer'),
  panelInner: document.getElementById('panelInner'),
  detailCard: document.getElementById('detailCard'),
  btnFavOnly: document.getElementById('btnFavOnly'),
};

function chip(label, active, onClick, removable) {
  const c = document.createElement('button');
  c.className = 'chip ' + (active ? 'active' : '');
  c.innerHTML = label + (removable ? ' <span class="remove">✕</span>' : '');
  if (onClick) c.onclick = (e) => { e.stopPropagation(); onClick(); };
  if (removable) c.querySelector('.remove').onclick = (e) => { e.stopPropagation(); onClick(); };
  return c;
}

function renderChips() {
  els.filtersStrip.innerHTML = '';
  if (STATE.prov) {
    const p = PROVINCIAS.find(x => x.id === STATE.prov);
    els.filtersStrip.appendChild(chip(p.nombre, true, () => setProv(null), true));
  } else {
    PROVINCIAS.forEach(p => els.filtersStrip.appendChild(chip(p.nombre, false, () => setProv(p.id))));
  }
  ['Precio Gasolina 95 E5','Precio Gasolina 98 E5','Precio Gasoleo A','Precio Gasoleo Premium','GLP'].forEach(c => {
    const nombre = c.replace('Precio ','');
    els.filtersStrip.appendChild(chip(nombre, STATE.combustible === c || (nombre === 'GLP' && STATE.combustible === 'Precio Gases licuados del petróleo'), () => setComb(c), true));
  });
  els.filtersStrip.appendChild(chip('⭐ Favoritos', STATE.soloFav, () => setFav(!STATE.soloFav)));
  els.filtersStrip.appendChild(chip('🔍 ' + (STATE.buscar || 'Buscar…'), false, () => {}));
}

function setProv(v) { STATE.prov = v; STATE.seleccionada = null; renderChips(); renderSidebar(); renderMap(); }
function setComb(v) { STATE.combustible = v; renderChips(); renderSidebar(); renderMap(); }
function setMarca(v) { STATE.marca = v; renderChips(); renderSidebar(); renderMap(); }
function setFav(v) { STATE.soloFav = v; renderChips(); renderSidebar(); renderMap(); }

function listaFiltrada() {
  const base = STATE.prov ? ESTACIONES.porProvincia(STATE.prov) : ESTACIONES;
  return filtrarEstaciones(base, { provincia: STATE.prov, combustible: STATE.combustible, marca: STATE.marca, buscar: STATE.buscar, soloFavoritos: STATE.soloFav });
}

function precioColor(est) {
  const p = est.precios[COMB] || 0;
  return p <= 1.45 ? 'green' : p <= 1.60 ? 'orange' : 'red';
}

function renderSidebar() {
  if (!STATE.prov) {
    els.headerTitle.textContent = 'Selecciona provincia';
    els.panelInner.innerHTML = '<div class="empty"><div class="icon">🗺️</div><h3>Elige una provincia</h3><p>Selecciona una provincia del filtro para ver sus estaciones.</p></div>';
    els.detailCard.innerHTML = '';
    return;
  }
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.headerTitle.textContent = prov.nombre;
  const lista = ordenarEstaciones(listaFiltrada(), STATE.orden, STATE.asc);
  els.panelInner.innerHTML = `
    <div class="section-title"><span>Estaciones</span><span class="count">${lista.length}</span></div>
    <div class="card-list">${lista.map(renderCard).join('')}</div>
  `;
  if (STATE.seleccionada) renderDetail(ESTACIONES.find(e => e.id === STATE.seleccionada));
  else els.detailCard.innerHTML = '';
}

function renderCard(est) {
  const c = precioColor(est);
  const favCls = est.favorito ? 'on' : '';
  const best = est.esMejor ? '<div class="rank best">1</div>' : '<div class="rank">-</div>';
  return `<div class="station-card ${est.id === STATE.seleccionada ? 'selected' : ''}" data-id="${est.id}">
    ${best}
    <div class="info">
      <div class="name">${est.nombre}</div>
      <div class="addr">${est.direccion} · ${est.localidad}</div>
    </div>
    <div class="right">
      <div class="price">${formatearPrecio(est.precios[COMB] || 0)} <span class="uni">€/L</span></div>
      <div class="dist" style="color:${c === 'green' ? '#2e7d32' : c === 'orange' ? '#f57c00' : '#c62828'};">${formatearDistancia(est.distancia)}</div>
      <button class="fav ${favCls}" data-id="${est.id}">${est.favorito ? '★' : '☆'}</button>
    </div>
  </div>`;
}

function renderDetail(est) {
  const c = precioColor(est);
  const colorCss = c === 'green' ? 'var(--green)' : c === 'orange' ? 'var(--orange)' : 'var(--red)';
  const pDesc = precioConDescuento(est, COMB);
  const hist = historicoParaGrafica(est, COMB);
  const primero = hist[hist.length - 1];
  const ultimo = hist[0];
  const variacion = ultimo && primero ? ((ultimo.precio - primero.precio) / primero.precio * 100) : 0;
  els.detailCard.innerHTML = `
    <h2>${est.nombre} <button class="detail-btn fav" data-id="${est.id}" data-fav="${est.favorito}" style="padding:0.25rem">${est.favorito ? '★' : '☆'}</button></h2>
    <div class="detail-grid">
      <div class="detail-row"><span class="label">Marca</span><span class="value">${est.marca}</span></div>
      <div class="detail-row"><span class="label">Dirección</span><span class="value">${est.direccion}</span></div>
      <div class="detail-row"><span class="label">Localidad</span><span class="value">${est.localidad}, ${est.provincia}</span></div>
      <div class="detail-row"><span class="label">Horario</span><span class="value">${est.horario}</span></div>
      <div class="detail-row"><span class="label">Distancia</span><span class="value">${formatearDistancia(est.distancia)}</span></div>
      <div class="detail-row"><span class="label">Precio</span><span class="value" style="color:${colorCss}">${formatearPrecio(est.precios[COMB] || 0)} €/L</span></div>
      <div class="detail-row"><span class="label">Con descuento ${est.descuento.toFixed(2)} €/L</span><span class="value">${formatearPrecio(pDesc)} €/L</span></div>
      <div class="detail-row"><span class="label">Variación 30d</span><span class="value">${variacion >= 0 ? '+' : ''}${variacion.toFixed(1)}%</span></div>
    </div>
    <div class="detail-actions">
      <button class="detail-btn primary">Ruta desde aquí</button>
      <button class="detail-btn" id="btnShare">Compartir</button>
    </div>
  `;
}

function abrirDetalle(id) {
  const est = ESTACIONES.find(e => e.id === id);
  if (!est) return;
  STATE.seleccionada = id;
  renderSidebar();
  renderMap();
}

function renderMap() {
  if (!STATE.prov) { els.mapLayer.innerHTML = ''; return; }
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  const lista = ordenarEstaciones(listaFiltrada(), STATE.orden, STATE.asc);
  els.mapLayer.innerHTML = lista.map(est => {
    const c = precioColor(est);
    const x = 50 + ((est.lat - prov.centro[0]) / 0.22) * 35;
    const y = 50 + ((prov.centro[1] - est.lng) / 0.22) * 35;
    return `<div class="map-marker ${c} ${est.id === STATE.seleccionada ? 'selected' : ''}" style="left:${Math.max(5,Math.min(95,x))}%;top:${Math.max(5,Math.min(95,y))}%;" data-id="${est.id}" title="${est.nombre}">${est.marca[0]}</div>`;
  }).join('');
}

/* Events */
els.btnOpenSidebar.onclick = () => { els.sidebar.classList.toggle('hidden'); };

els.panelInner.onclick = (e) => {
  const card = e.target.closest('.station-card');
  if (!card) return;
  const fav = e.target.closest('.fav');
  if (fav) {
    e.stopPropagation();
    const id = Number(fav.dataset.id);
    const est = ESTACIONES.find(e2 => e2.id === id);
    est.favorito = !est.favorito;
    renderSidebar();
    renderMap();
    return;
  }
  abrirDetalle(Number(card.dataset.id));
};

els.detailCard.onclick = (e) => {
  const fav = e.target.closest('.detail-btn.fav');
  if (fav) {
    e.stopPropagation();
    const id = Number(fav.dataset.id);
    const est = ESTACIONES.find(e2 => e2.id === id);
    est.favorito = !est.favorito;
    renderSidebar();
    renderMap();
  }
};

els.mapLayer.onclick = (e) => {
  const m = e.target.closest('.map-marker');
  if (!m) return;
  abrirDetalle(Number(m.dataset.id));
};

els.btnFavOnly.onclick = () => { setFav(!STATE.soloFav); els.btnFavOnly.classList.toggle('active', STATE.soloFav); };

/* Keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '5') {
    const prov = PROVINCIAS[Number(e.key) - 1];
    if (prov) setProv(prov.id);
  }
  if (e.key.toLowerCase() === 'f') setFav(!STATE.soloFav);
  if (e.key === 'Escape') setProv(null);
});

renderChips();
renderSidebar();
renderMap();
</script>
</body>
</html>
