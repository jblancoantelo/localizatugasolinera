<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f4f6f9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 16px;
  --touch: 48px;
}
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; -webkit-touch-callout: none; }
.app { display: flex; flex-direction: column; height: 100vh; position: relative; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding: max(0.5rem, env(safe-area-inset-top)) 1rem 0.6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
.app-header .back { display: none; font-size: 1.3rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0.4rem; border-radius: 50%; }
.app-header .back.show { display: block; }
.app-header .back:hover { background: #f1f3f5; }
.app-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.3px; flex: 1; text-align: center; }
.app-actions { display: flex; gap: 0.3rem; align-items: center; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }

/* Chip bar */
.chip-bar { display: flex; gap: 0.4rem; padding: 0.5rem 1rem 0.4rem; overflow-x: auto; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 0.78rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--shadow); }
.chip .remove { font-size: 1rem; line-height: 1; padding: 0 0.1rem; }

/* Search */
.search-wrap { padding: 0.4rem 1rem; display: none; gap: 0.5rem; align-items: center; background: #fff; border-bottom: 1px solid var(--line); }
.search-wrap.open { display: flex; }
.search-wrap input { flex: 1; padding: 0.55rem 0.9rem; border: 1px solid var(--line); border-radius: 10px; font-size: 0.9rem; background: #f8fafc; }
.search-wrap input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }

/* View container */
.view { flex: 1; overflow-y: auto; padding: 0.5rem 1rem 110px; position: relative; }
.view > section { display: none; }
.view > section.active { display: block; }

/* Empty state */
.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty h3 { font-size: 1rem; margin-bottom: 0.3rem; color: var(--text); }
.empty p { font-size: 0.85rem; }

/* Fake map */
.map-wrap { position: relative; height: 220px; border-radius: var(--radius); overflow: hidden; background: #dbeafe; margin-bottom: 0.75rem; border: 1px solid var(--line); }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
.map-marker { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; transform: translate(-50%, -50%); display: grid; place-items: center; font-size: 0.75rem; z-index: 5; transition: transform 0.15s, box-shadow 0.15s; }
.map-marker.green { background: var(--green); }
.map-marker.orange { background: var(--orange); }
.map-marker.red { background: var(--red); }
.map-marker.selected { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(26,115,232,0.35); }

/* List cards */
.card-list { display: flex; flex-direction: column; gap: 0.6rem; }
.station-card { display: flex; align-items: center; gap: 0.75rem; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.85rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; min-height: var(--touch); }
.station-card:active { transform: scale(0.995); }
.station-card .rank { width: 26px; height: 26px; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.station-card .rank.best { background: var(--green); color: #fff; }
.station-card .info { flex: 1; min-width: 0; }
.station-card .name { font-weight: 700; font-size: 0.88rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-card .addr { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; }
.station-card .price { font-weight: 800; font-size: 1.1rem; color: var(--text); }
.station-card .price .uni { font-size: 0.65rem; color: var(--muted); font-weight: 600; }
.station-card .dist { font-size: 0.7rem; color: var(--muted); background: #f1f5f9; padding: 0.12rem 0.5rem; border-radius: 999px; border: 1px solid #cbd5e1; }
.station-card .fav { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1rem; color: #b0b0b0; flex-shrink: 0; }
.station-card .fav.on { color: #f9a825; border-color: #f9a825; background: #fff7e0; }
.station-card .fav:active { transform: scale(0.9); }

/* Legend */
.legend { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.5rem; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 0.25rem; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: max(env(safe-area-inset-bottom), 0.5rem); left: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem; box-shadow: var(--shadow); z-index: 60; }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.42rem 0.25rem; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.62rem; color: #94a3b8; min-height: var(--touch); }
.nav-tab .icon { font-size: 1.25rem; line-height: 1; }
.nav-tab.active { background: #eef2ff; color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }

/* FAB */
.fab-wrap { position: fixed; bottom: 110px; right: 1rem; z-index: 55; }
.fab { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #fff; border: none; box-shadow: 0 4px 14px rgba(26,115,232,0.35); cursor: pointer; display: grid; place-items: center; font-size: 1.4rem; transition: transform 0.15s, background 0.15s; }
.fab:active { transform: scale(0.92); background: var(--brand-dark); }

/* Bottom sheet (detail) */
.bottom-sheet { position: fixed; inset: auto 0 0 0; z-index: 100; background: #fff; border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.12); transform: translateY(100vh); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); height: 100vh; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
.bottom-sheet.open { transform: translateY(0); }
.bottom-sheet .sheet-handle { width: 32px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 0.5rem auto 0.2rem; cursor: pointer; }
.bottom-sheet .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); }
.bottom-sheet .sheet-header h2 { font-size: 1rem; font-weight: 700; }
.bottom-sheet .sheet-close { font-size: 1.2rem; background: none; border: none; cursor: pointer; color: var(--muted); padding: 0.3rem; border-radius: 50%; }
.bottom-sheet .sheet-close:hover { background: #f1f3f5; }
.bottom-sheet .sheet-body { flex: 1; overflow-y: auto; padding: 1rem; }
.sheet-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
.sheet-row .label { color: var(--muted); }
.sheet-row .value { font-weight: 600; }
.sheet-actions { padding: 0.8rem 1rem; border-top: 1px solid var(--line); display: flex; gap: 0.5rem; }
.sheet-btn { flex: 1; padding: 0.6rem; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
.sheet-btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.sheet-btn.fav { width: 56px; }
.sheet-chart-wrap { position: relative; height: 150px; margin-top: 0.6rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.sheet-canvas { width: 100%; height: 100%; }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton.text { height: 0.9rem; margin-bottom: 0.4rem; }
.skeleton.wide { width: 60%; }
.skeleton.price { height: 1.2rem; width: 45%; font-size: 1rem; }

/* Pull to refresh */
.ptr { position: absolute; top: 0; left: 0; right: 0; height: 60px; opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--muted); pointer-events: none; }
.ptr.visible { opacity: 1; }

/* Toast */
.toast { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(26,26,46,0.9); color: #fff; padding: 0.6rem 1rem; border-radius: 24px; font-size: 0.8rem; z-index: 70; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="back" id="btnBack">‹</button>
    <div class="app-title" id="headerTitle">Gasolineras</div>
    <div class="app-actions">
      <button class="icon-btn" id="btnMap" title="Mapa">🗺️</button>
      <button class="icon-btn" id="btnList" title="Lista" active>📋</button>
      <button class="icon-btn" id="btnSearch" title="Buscar">🔍</button>
    </div>
  </header>

  <div class="chip-bar" id="chipBar"></div>

  <div class="search-wrap" id="searchWrap">
    <input type="text" id="inpSearch" placeholder="Buscar localidad, calle o marca...">
    <button class="icon-btn" id="btnCloseSearch" style="font-size:1.2rem">✕</button>
  </div>

  <div class="ptr" id="ptr">↻ Actualizar</div>

  <div class="view" id="view">
    <section id="secEmpty" class="active">
      <div class="empty">
        <div class="icon">📍</div>
        <h3>Selecciona una provincia</h3>
        <p>Elige una provincia para ver sus estaciones y precios.</p>
      </div>
    </section>

    <section id="secMap">
      <div class="map-wrap" id="mapWrap">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card-list" id="listMap"></div>
    </section>

    <section id="secList">
      <div class="legend" id="legendList"></div>
      <div class="card-list" id="list"></div>
    </section>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab active" data-tab="list">
      <span class="icon">📋</span><span>Listado</span>
    </button>
    <button class="nav-tab" data-tab="map">
      <span class="icon">🗺️</span><span>Mapa</span>
    </button>
    <button class="nav-tab" data-tab="filtros">
      <span class="icon">🔧</span><span>Filtros</span>
    </button>
  </nav>

  <div class="fab-wrap">
    <button class="fab" id="btnGeo" title="Mi ubicación">📍</button>
  </div>

  <aside class="bottom-sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="sheetNombre">Estación</h2>
      <button class="sheet-close" id="btnSheetClose">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-actions">
      <button class="sheet-btn fav" id="sheetFav" title="Favorito">☆</button>
      <button class="sheet-btn primary" id="sheetRuta">Ver en mapa</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>
</div>
<script>
const STATE = { prov: null, combustible: '', marca: '', buscar: '', soloFav: false, view: 'list', orden: 'precio', asc: true, seleccionada: null };
const COMB = 'Precio Gasolina 95 E5';
const els = {};
['chipBar','searchWrap','inpSearch','btnSearch','btnCloseSearch','btnMap','btnList','secMap','secList','secEmpty','list','listMap','mapLayer','headerTitle','btnBack','bottomNav','sheet','sheetBody','sheetNombre','sheetFav','btnSheetClose','btnGeo','ptr','toast'].forEach(k => { els[k] = document.getElementById(k); });
function toast(m){const t=els.toast;t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function provChip(p,sel){const c=document.createElement('button');c.className='chip '+(sel?'active':'');if(sel){c.innerHTML=p.nombre+' <span class="remove">✕</span>';c.querySelector('.remove').onclick=e=>{e.stopPropagation();setProv(null);}}else{c.innerHTML=p.nombre;}c.onclick=e=>{e.stopPropagation();setProv(p.id);};return c;}
function combChip(){const c=document.createElement('button');c.className='chip active';c.innerHTML='Gasolina 95 <span class="remove">✕</span>';c.onclick=e=>{e.stopPropagation();setComb('');};c.querySelector('.remove').onclick=e=>{e.stopPropagation();setComb('');};return c;}
function renderChips(){els.chipBar.innerHTML='';if(!STATE.prov){PROVINCIAS.forEach(p=>els.chipBar.appendChild(provChip(p,false)));}else{const p=PROVINCIAS.find(x=>x.id===STATE.prov);els.chipBar.appendChild(provChip(p,true));}if(STATE.combustible)els.chipBar.appendChild(combChip());if(STATE.marca){const c=document.createElement('button');c.className='chip active';c.innerHTML=STATE.marca+' <span class="remove">✕</span>';c.onclick=e=>{e.stopPropagation();setMarca('');};c.querySelector('.remove').onclick=e=>{e.stopPropagation();setMarca('');};els.chipBar.appendChild(c);}if(STATE.soloFav){const c=document.createElement('button');c.className='chip active';c.innerHTML='⭐ Favoritos <span class="remove">✕</span>';c.onclick=e=>{e.stopPropagation();setFav(false);};c.querySelector('.remove').onclick=e=>{e.stopPropagation();setFav(false);};els.chipBar.appendChild(c);}if(STATE.buscar){const c=document.createElement('button');c.className='chip active';c.innerHTML='🔍 '+STATE.buscar+' <span class="remove">✕</span>';c.onclick=e=>{e.stopPropagation();setBuscar('');};c.querySelector('.remove').onclick=e=>{e.stopPropagation();setBuscar('');};els.chipBar.appendChild(c);}}
function setProv(id){STATE.prov=id;STATE.seleccionada=null;renderChips();render();}
function setComb(v){STATE.combustible=v;renderChips();render();}
function setMarca(v){STATE.marca=v;renderChips();render();}
function setFav(v){STATE.soloFav=v;renderChips();render();}
function setBuscar(v){STATE.buscar=v;renderChips();render();}
function setView(v){STATE.view=v;renderChips();render();}
function setOrden(por){if(STATE.orden===por)STATE.asc=!STATE.asc;else{STATE.orden=por;STATE.asc=true;}render();}
function precioColor(est){const p=est.precios[COMB]||0;return p<=1.45?'green':p<=1.60?'orange':'red';}
function listaFiltrada(){const base=STATE.prov?ESTACIONES.porProvincia(STATE.prov):ESTACIONES;return filtrarEstaciones(base,{provincia:STATE.prov,combustible:STATE.combustible,marca:STATE.marca,buscar:STATE.buscar,soloFavoritos:STATE.soloFav});}
function render(){if(!STATE.prov){els.secEmpty.classList.add('active');els.secMap.classList.remove('active');els.secList.classList.remove('active');els.headerTitle.textContent='Gasolineras';els.btnBack.style.display='none';return;}els.secEmpty.classList.remove('active');const prov=PROVINCIAS.find(p=>p.id===STATE.prov);els.headerTitle.textContent=prov.nombre;els.btnBack.style.display='block';const lista=ordenarEstaciones(listaFiltrada(),STATE.orden,STATE.asc);const markerHTML=(est,sel)=>{const c=precioColor(est);const x=50+((est.lat-prov.centro[0])/0.2)*40;const y=50+((prov.centro[1]-est.lng)/0.2)*40;return `<div class="map-marker ${c} ${sel?'selected':''}" style="left:${x}%;top:${y}%;" data-id="${est.id}" title="${est.nombre}">${est.marca[0]}</div>`;};if(STATE.view==='map'){els.secMap.classList.add('active');els.secList.classList.remove('active');els.mapLayer.innerHTML=lista.map(est=>markerHTML(est,est.id===STATE.seleccionada)).join('');els.listMap.innerHTML=lista.map(renderCard).join('');}else{els.secList.classList.add('active');els.secMap.classList.remove('active');els.list.innerHTML=lista.map(renderCard).join('');}}
function renderCard(est){const c=precioColor(est);const favCls=est.favorito?'on':'';const best=est.esMejor?'<div class="rank best">1</div>':'<div class="rank">-</div>';return `<div class="station-card ${est.id===STATE.seleccionada?'selected':''}" data-id="${est.id}">${best}<div class="info"><div class="name">${est.nombre}</div><div class="addr">${est.direccion} · ${est.localidad}</div></div><div class="right"><div class="price">${formatearPrecio(est.precios[COMB]||0)} <span class="uni">€/L</span></div><div class="dist" style="color:${c==='green'?'#2e7d32':c==='orange'?'#f57c00':'#c62828'};border-color:${c==='green'?'#a5d6a7':c==='orange'?'#ffcc80':'#ef9a9a'};">${formatearDistancia(est.distancia)}</div><button class="fav ${favCls}" data-id="${est.id}">${est.favorito?'★':'☆'}</button></div></div>`;}
function abrirDetalle(id){const est=ESTACIONES.find(e=>e.id===id);if(!est)return;STATE.seleccionada=id;render();const pDesc=precioConDescuento(est,COMB);const color=precioColor(est);const hist=historicoParaGrafica(est,COMB);const primero=hist[hist.length-1];const ultimo=hist[0];const variacion=ultimo&&primero?((ultimo.precio-primero.precio)/primero.precio*100):0;els.sheetNombre.textContent=est.nombre;els.sheetBody.innerHTML=`<div class="sheet-row"><span class="label">Marca</span><span class="value">${est.marca}</span></div><div class="sheet-row"><span class="label">Dirección</span><span class="value">${est.direccion}</span></div><div class="sheet-row"><span class="label">Localidad</span><span class="value">${est.localidad}, ${est.provincia}</span></div><div class="sheet-row"><span class="label">Horario</span><span class="value">${est.horario}</span></div><div class="sheet-row"><span class="label">Distancia</span><span class="value">${formatearDistancia(est.distancia)}</span></div><div class="sheet-row"><span class="label">Precio ${COMB.replace('Precio ','')}</span><span class="value" style="color:var(--${color==='green'?'green':color==='orange'?'orange':'red'})">${formatearPrecio(est.precios[COMB]||0)} €/L</span></div><div class="sheet-row"><span class="label">Con descuento ${est.descuento.toFixed(2)} €/L</span><span class="value">${formatearPrecio(pDesc)} €/L</span></div><div class="sheet-row"><span class="label">Variación 30d</span><span class="value">${variacion>=0?'+':''}${variacion.toFixed(1)}%</span></div><div class="sheet-chart-wrap"><canvas class="sheet-canvas" id="sheetCanvas"></canvas></div>`;els.sheetFav.textContent=est.favorito?'★':'☆';els.sheetFav.dataset.fav=est.favorito;els.sheet.classList.add('open');document.body.style.overflow='hidden';dibujarGrafica(hist);}
function dibujarGrafica(hist){const cv=document.getElementById('sheetCanvas');const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;const w=cv.parentElement.clientWidth;const h=150;cv.width=w*dpr;cv.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!hist||hist.length<2)return;const precios=hist.map(f=>f.precio);const min=Math.min(...precios),max=Math.max(...precios);const pad=(max-min)*0.2||1;const yMin=min-pad,yMax=max+pad;const n=hist.length;const xStep=w/(n-1||1);const toY=p=>h-20-((p-yMin)/(yMax-yMin))*(h-40);ctx.beginPath();ctx.strokeStyle='#1a73e8';ctx.lineWidth=2;hist.forEach((f,i)=>{const x=i*xStep;const y=toY(f.precio);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();hist.forEach((f,i)=>{const x=i*xStep;const y=toY(f.precio);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle=i===n-1?'#1a73e8':'#e5e7eb';ctx.fill();});ctx.fillStyle='#1a73e8';ctx.font='600 11px system-ui';ctx.fillText(formatearPrecio(hist[n-1].precio)+' €/L · '+hist[n-1].fecha,6,16);}
function cerrarSheet(){els.sheet.classList.remove('open');document.body.style.overflow='';STATE.seleccionada=null;render();}
els.btnList.onclick=()=>{setView('list');els.btnList.classList.add('active');els.btnMap.classList.remove('active');render();};
els.btnMap.onclick=()=>{setView('map');els.btnMap.classList.add('active');els.btnList.classList.remove('active');render();};
els.btnSearch.onclick=()=>{els.searchWrap.classList.add('open');els.inpSearch.focus();};
els.btnCloseSearch.onclick=e=>{e.stopPropagation();els.searchWrap.classList.remove('open');els.inpSearch.value='';setBuscar('');};
els.inpSearch.oninput=e=>setBuscar(e.target.value);
els.btnBack.onclick=()=>setProv(null);
els.btnSheetClose.onclick=cerrarSheet;
els.sheetFav.onclick=e=>{e.stopPropagation();const est=ESTACIONES.find(e2=>e2.id===STATE.seleccionada);if(!est)return;est.favorito=!est.favorito;els.sheetFav.textContent=est.favorito?'★':'☆';els.sheetFav.dataset.fav=est.favorito;toast(est.favorito?'Añadido a favoritos':'Eliminado de favoritos');render();};
els.sheet.querySelector('.sheet-btn.primary').onclick=()=>{setView('map');els.btnMap.classList.add('active');els.btnList.classList.remove('active');cerrarSheet();};
function hCardClick(card,favEl){if(favEl){eStop(favEl);const id=Number(favEl.dataset.id);const est=ESTACIONES.find(e2=>e2.id===id);est.favorito=!est.favorito;favEl.textContent=est.favorito?'★':'☆';favEl.className='fav '+(est.favorito?'on':'');favEl.dataset.fav=est.favorito;toast(est.favorito?'Añadido a favoritos':'Eliminado de favoritos');render();return;}abrirDetalle(Number(card.dataset.id));}
function eStop(el){el.addEventListener('click',e=>e.stopPropagation(),true);}
els.mapLayer.onclick=e=>{const m=e.target.closest('.map-marker');if(!m)return;abrirDetalle(Number(m.dataset.id));};
function setupListClicks(listEl){listEl.onclick=e=>{const card=e.target.closest('.station-card');if(!card)return;const fav=e.target.closest('.fav');hCardClick(card,fav);};}
setupListClicks(els.list);setupListClicks(els.listMap);
let ptrStart=0;els.view.addEventListener('touchstart',e=>{ptrStart=e.touches[0].clientY;});els.view.addEventListener('touchmove',e=>{if(els.view.scrollTop===0&&e.touches[0].clientY-ptrStart>40)els.ptr.classList.add('visible');});els.view.addEventListener('touchend',()=>{if(!els.ptr.classList.contains('visible'))return;els.ptr.classList.remove('visible');toast('Actualizando datos…');});
els.btnGeo.onclick=()=>toast('Ubicación activada (simulada)');
els.bottomNav.onclick=e=>{const tab=e.target.closest('.nav-tab');if(!tab)return;els.bottomNav.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');};
renderChips();render();
</script>
</body>
</html>
