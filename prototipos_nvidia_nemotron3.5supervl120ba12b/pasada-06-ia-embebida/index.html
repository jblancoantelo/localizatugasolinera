<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prototipo 6 · IA Embebida · Gasolineras</title>
<link rel="preload" as="script" href="../datos-fake.js">
<script src="../datos-fake.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f4f6f9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 14px;
  --touch: 44px;
}
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100vh; position: relative; }

.app-header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: max(0.5rem, env(safe-area-inset-top)) 1rem 0.6rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.app-header .back { display: none; font-size: 1.3rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0.4rem; border-radius: 50%; }
.app-header .back.show { display: block; }
.app-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.3px; flex: 1; text-align: center; }
.app-actions { display: flex; gap: 0.3rem; align-items: center; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }

.chip-bar { display: flex; gap: 0.4rem; padding: 0.5rem 1rem 0.4rem; overflow-x: auto; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 0.78rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--shadow); }
.chip .remove { font-size: 1rem; line-height: 1; padding: 0 0.1rem; }

.view { flex: 1; overflow-y: auto; padding: 0.5rem 1rem 100px; position: relative; }
.view > section { display: none; }
.view > section.active { display: block; }

.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty h3 { font-size: 1rem; margin-bottom: 0.3rem; color: var(--text); }

.map-wrap { position: relative; height: 200px; border-radius: var(--radius); overflow: hidden; background: #dbeafe; margin-bottom: 0.6rem; border: 1px solid var(--line); }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
.map-layer { position: absolute; inset: 0; pointer-events: none; }
.map-marker { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; transform: translate(-50%, -50%); display: grid; place-items: center; font-size: 0.75rem; z-index: 5; transition: transform 0.15s; }
.map-marker.green { background: var(--green); }
.map-marker.orange { background: var(--orange); }
.map-marker.red { background: var(--red); }
.map-marker.selected { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(26,115,232,0.35); }

/* Assistant sheet */
.assistant { position: fixed; inset: auto 0 0 0; z-index: 90; background: #fff; border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.12); transform: translateY(100vh); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); height: 55vh; min-height: 300px; display: flex; flex-direction: column; overflow: hidden; }
.assistant.open { transform: translateY(0); }
.assistant .sheet-handle { width: 32px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 0.5rem auto 0.2rem; cursor: pointer; }
.assistant .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.assistant .sheet-header h2 { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
.assistant .sheet-close { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--muted); padding: 0.2rem; border-radius: 50%; }
.assistant .sheet-close:hover { background: #f1f3f5; }
.assistant .ia-messages { flex: 1; overflow-y: auto; padding: 0.7rem 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.ia-msg { max-width: 85%; padding: 0.6rem 0.8rem; border-radius: 10px; font-size: 0.85rem; line-height: 1.4; }
.ia-msg.user { align-self: flex-end; background: #eef2ff; color: var(--text); border-bottom-right-radius: 2px; }
.ia-msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); color: var(--text); border-bottom-left-radius: 2px; }
.ia-msg.meta { font-size: 0.65rem; color: var(--muted); margin-top: 0.25rem; }
.ia-msg.empty { align-self: center; max-width: 100%; text-align: center; color: var(--muted); padding: 1rem; }
.ia-typing { display: inline-block; }
.ia-typing::after { content: '…'; animation: typing 1.4s infinite; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

.assistant .ia-input-row { display: flex; gap: 0.5rem; padding: 0.6rem 1rem; border-top: 1px solid var(--line); flex-shrink: 0; background: #fff; }
.assistant .ia-input-row input { flex: 1; padding: 0.55rem 0.9rem; border: 1px solid var(--line); border-radius: 10px; font-size: 0.88rem; background: #f8fafc; }
.assistant .ia-input-row input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
.assistant .ia-input-row button { padding: 0.55rem 0.9rem; border: none; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
.assistant .ia-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Quick suggestions */
.quick { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0 1rem 0.4rem; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick-btn { white-space: nowrap; padding: 0.4rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 0.78rem; color: var(--text); cursor: pointer; }
.quick-btn:hover { border-color: var(--brand); }

/* Station cards behind */
.card-list { display: flex; flex-direction: column; gap: 0.6rem; }
.station-card { display: flex; align-items: center; gap: 0.7rem; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.65rem 0.8rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; min-height: var(--touch); }
.station-card:active { transform: scale(0.995); }
.station-card.selected { border-color: var(--brand); background: #eef6ff; }
.station-card .rank { width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.station-card .rank.best { background: var(--green); color: #fff; }
.station-card .info { flex: 1; min-width: 0; }
.station-card .name { font-weight: 700; font-size: 0.86rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-card .addr { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
.station-card .price { font-weight: 800; font-size: 1rem; color: var(--text); }
.station-card .price .uni { font-size: 0.6rem; color: var(--muted); font-weight: 600; }
.station-card .dist { font-size: 0.68rem; color: var(--muted); background: #f1f5f9; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid #cbd5e1; }
.station-card .fav { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 0.95rem; color: #b0b0b0; flex-shrink: 0; }
.station-card .fav.on { color: #f9a825; border-color: #f9a825; background: #fff7e0; }

.legend { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.5rem; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 0.25rem; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; }

.bottom-nav { position: fixed; bottom: max(env(safe-area-inset-bottom), 0.5rem); left: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem; box-shadow: var(--shadow); z-index: 60; }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.42rem 0.25rem; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.62rem; color: #94a3b8; min-height: var(--touch); }
.nav-tab .icon { font-size: 1.25rem; line-height: 1; }
.nav-tab.active { background: #eef2ff; color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }

.toast { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(26,26,46,0.9); color: #fff; padding: 0.6rem 1rem; border-radius: 24px; font-size: 0.8rem; z-index: 70; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (min-width: 1024px) {
  .app { flex-direction: row; }
  .app-header { position: fixed; inset: 0 0 auto 0; width: 100%; flex-direction: column; padding: 1rem; }
  .app-header .app-actions { margin-left: auto; }
  .view { padding-bottom: 100px; padding-right: 420px; }
  .assistant { position: fixed; inset: 0 auto 0 0; width: 400px; height: 100%; top: 0; right: 0; border-left: 1px solid var(--line); border-radius: 0; transform: translateX(100%); }
  .assistant.open { transform: translateX(0); }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="back" id="btnBack">‹</button>
    <div class="app-title" id="headerTitle">Asistente IA</div>
    <div class="app-actions">
      <button class="icon-btn" id="btnOpenIA" title="Asistente" active>🤖</button>
      <button class="icon-btn" id="btnMapView" title="Mapa">🗺️</button>
    </div>
  </header>

  <div class="chip-bar" id="chipBar"></div>

  <div class="view" id="view">
    <section id="secEmpty" class="active">
      <div class="empty">
        <div class="icon">📍</div>
        <h3>Selecciona una provincia</h3>
        <p>Elige una provincia para consultar al asistente sobre precios.</p>
      </div>
    </section>
    <section id="secMain">
      <div class="map-wrap" id="mapWrap">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card-list" id="list"></div>
    </section>
  </div>

  <div class="quick" id="quick">
    <button class="quick-btn" data-q="¿Cuál es la gasolinera más barata?">Más barata</button>
    <button class="quick-btn" data-q="¿Cuánto costaría llenar el depósito?">Llenar depósito</button>
    <button class="quick-btn" data-q="Evolución del precio en 30 días">Evolución 30d</button>
    <button class="quick-btn" data-q="Compara Repsol vs Cepsa">Compara marcas</button>
    <button class="quick-btn" data-q="¿Hay alguna cerca de mí?">Cerca de mí</button>
  </div>

  <div class="assistant" id="assistant">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>🤖 Asistente</h2>
      <button class="sheet-close" id="btnCloseIA">✕</button>
    </div>
    <div class="ia-messages" id="iaMessages">
      <div class="ia-msg assistant empty">Pregúntame sobre precios, estaciones o historial de tu provincia.</div>
    </div>
    <div class="ia-input-row">
      <input type="text" id="iaInput" placeholder="Pregunta al asistente…">
      <button id="iaSend">Enviar</button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab active" data-tab="list"><span class="icon">📋</span><span>Listado</span></button>
    <button class="nav-tab" data-tab="map"><span class="icon">🗺️</span><span>Mapa</span></button>
  </nav>

  <div class="toast" id="toast"></div>
</div>
<script>
const STATE = {
  prov: null,
  combustible: '',
  marca: '',
  buscar: '',
  soloFav: false,
  seleccionada: null,
  iaOpen: false,
};
const COMB = 'Precio Gasolina 95 E5';

const els = {
  chipBar: document.getElementById('chipBar'),
  secEmpty: document.getElementById('secEmpty'),
  secMain: document.getElementById('secMain'),
  list: document.getElementById('list'),
  mapLayer: document.getElementById('mapLayer'),
  headerTitle: document.getElementById('headerTitle'),
  btnBack: document.getElementById('btnBack'),
  assistant: document.getElementById('assistant'),
  iaMessages: document.getElementById('iaMessages'),
  iaInput: document.getElementById('iaInput'),
  iaSend: document.getElementById('iaSend'),
  btnOpenIA: document.getElementById('btnOpenIA'),
  btnCloseIA: document.getElementById('btnCloseIA'),
  quick: document.getElementById('quick'),
  toast: document.getElementById('toast'),
};

function toast(msg) {
  const t = els.toast; t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function chip(label, active, onClick, removable) {
  const c = document.createElement('button');
  c.className = 'chip ' + (active ? 'active' : '');
  c.innerHTML = label + (removable ? ' <span class="remove">✕</span>' : '');
  if (onClick) c.onclick = (e) => { e.stopPropagation(); onClick(); };
  if (removable) c.querySelector('.remove').onclick = (e) => { e.stopPropagation(); onClick(); };
  return c;
}

function renderChips() {
  els.chipBar.innerHTML = '';
  if (STATE.prov) {
    const p = PROVINCIAS.find(x => x.id === STATE.prov);
    els.chipBar.appendChild(chip(p.nombre, true, () => setProv(null), true));
  } else {
    PROVINCIAS.forEach(p => els.chipBar.appendChild(chip(p.nombre, false, () => setProv(p.id))));
  }
}

function setProv(v) { STATE.prov = v; STATE.seleccionada = null; renderChips(); render(); renderIAContext(); }
function precioColor(est) {
  const p = est.precios[COMB] || 0;
  return p <= 1.45 ? 'green' : p <= 1.60 ? 'orange' : 'red';
}

function listaFiltrada() {
  const base = STATE.prov ? ESTACIONES.porProvincia(STATE.prov) : ESTACIONES;
  return filtrarEstaciones(base, { provincia: STATE.prov, combustible: STATE.combustible, marca: STATE.marca, buscar: STATE.buscar, soloFavoritos: !!STATE.soloFav });
}

function render() {
  if (!STATE.prov) {
    els.secEmpty.classList.add('active'); els.secMain.classList.remove('active');
    els.headerTitle.textContent = 'Asistente IA'; els.btnBack.style.display = 'none';
    els.mapLayer.innerHTML = ''; els.list.innerHTML = '';
    return;
  }
  els.secEmpty.classList.remove('active'); els.secMain.classList.add('active');
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.headerTitle.textContent = prov.nombre; els.btnBack.style.display = 'block';
  const lista = ordenarEstaciones(listaFiltrada(), 'precio', true);
  renderMap(lista);
  els.list.innerHTML = lista.map(renderCard).join('');
}

function renderMap(lista) {
  if (!STATE.prov) { els.mapLayer.innerHTML = ''; return; }
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.mapLayer.innerHTML = lista.map(est => {
    const c = precioColor(est);
    const x = 50 + ((est.lat - prov.centro[0]) / 0.2) * 40;
    const y = 50 + ((prov.centro[1] - est.lng) / 0.2) * 40;
    return `<div class="map-marker ${c} ${est.id === STATE.seleccionada ? 'selected' : ''}" style="left:${Math.max(5,Math.min(95,x))}%;top:${Math.max(5,Math.min(95,y))}%;" data-id="${est.id}" title="${est.nombre}">${est.marca[0]}</div>`;
  }).join('');
}

function renderCard(est) {
  const c = precioColor(est);
  const favCls = est.favorito ? 'on' : '';
  const best = est.esMejor ? '<div class="rank best">1</div>' : '<div class="rank">-</div>';
  return `<div class="station-card ${est.id === STATE.seleccionada ? 'selected' : ''}" data-id="${est.id}">
    ${best}
    <div class="info">
      <div class="name">${est.nombre}</div>
      <div class="addr">${est.direccion} · ${est.localidad}</div>
    </div>
    <div class="right">
      <div class="price">${formatearPrecio(est.precios[COMB] || 0)} <span class="uni">€/L</span></div>
      <div class="dist" style="color:${c === 'green' ? '#2e7d32' : c === 'orange' ? '#f57c00' : '#c62828'};">${formatearDistancia(est.distancia)}</div>
      <button class="fav ${favCls}" data-id="${est.id}">${est.favorito ? '★' : '☆'}</button>
    </div>
  </div>`;
}

function renderIAContext() {
  if (!STATE.prov) return;
  const lista = listaFiltrada();
  const mejor = lista.reduce((a, b) => (a.precios[COMB] || 99) < (b.precios[COMB] || 99) ? a : b, null);
  const ctx = document.getElementById('iaCtx');
  if (ctx) ctx.textContent = 'Contexto: ' + (mejor ? mejor.nombre + ' (' + formatearPrecio(mejor.precios[COMB]) + ' €/L)' : 'sin datos');
}

function addMsg(role, html, raw) {
  const div = document.createElement('div');
  div.className = 'ia-msg ' + role;
  div.innerHTML = html;
  if (raw) div.setAttribute('data-raw', raw);
  els.iaMessages.appendChild(div);
  els.iaMessages.scrollTop = els.iaMessages.scrollHeight;
  return div;
}

function setTyping(show) {
  let t = els.iaMessages.querySelector('.ia-typing-wrap');
  if (show && !t) {
    const wrap = document.createElement('div'); wrap.className = 'ia-typing-wrap';
    wrap.innerHTML = '<div class="ia-msg assistant"><span class="ia-typing">El asistente está escribiendo</span></div>';
    els.iaMessages.appendChild(wrap);
  }
  if (!show && t) t.remove();
  els.iaMessages.scrollTop = els.iaMessages.scrollHeight;
}

/* Respuesta simulada del asistente */
function responderIA(pregunta) {
  const q = pregunta.toLowerCase();
  const lista = listaFiltrada();
  const mejor = lista.reduce((a, b) => (a.precios[COMB] || 99) < (b.precios[COMB] || 99) ? a : b, null);
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  let respuesta = '';
  if (q.includes('barata') || q.includes('más barata') || q.includes('menor')) {
    respuesta = mejor
      ? `La estación más barata de ${prov.nombre} para ${COMB.replace('Precio ','')} es <strong>${mejor.nombre}</strong> (${mejor.marca}) a <strong>${formatearPrecio(mejor.precios[COMB])} €/L</strong>.<br>📍 ${mejor.direccion}, ${mejor.localidad}.`
      : 'No encontré estaciones con precio en esta provincia.';
  } else if (q.includes('depósito') || q.includes('llenar')) {
    const litros = 50;
    const p = mejor ? mejor.precios[COMB] : 1.55;
    respuesta = `Llenar un depósito de <strong>${litros} L</strong> costaría aprox. <strong>${formatearPrecio(p * litros)} €</strong> al precio más barato (${formatearPrecio(p)} €/L).`;
  } else if (q.includes('evolución') || q.includes('30 días') || q.includes('historial')) {
    respuesta = `En los últimos 30 días, el precio de ${COMB.replace('Precio ','')} en ${prov.nombre>0?prov.nombre:''} ha variado levemente (datos simulados). La estación <strong>${mejor ? mejor.nombre : '—'}</strong> mantiene el precio más estable y barato.`;
  } else if (q.includes('compara') || q.includes('repsol') || q.includes('cepsa')) {
    const marcas = [...new Set(lista.map(e => e.marca))].slice(0, 4).map(m => {
      const deMarca = lista.filter(e => e.marca === m);
      const prom = deMarca.reduce((s, e) => s + (e.precios[COMB] || 0), 0) / deMarca.length;
      return `• <strong>${m}</strong>: media ${formatearPrecio(prom)} €/L`;
    }).join('<br>');
    respuesta = `Comparativa en ${prov.nombre}:<br>${marcas}`;
  } else {
    respuesta = `Puedo ayudarte a encontrar la gasolinera más barata, calcular el coste de llenar el depósito o consultar la evolución de precios en ${prov.nombre}. Prueba con: “¿Cuál es la más barata?” o “Evolución en 30 días”.`;
  }
  return respuesta;
}

function handleSend() {
  const texto = els.iaInput.value.trim();
  if (!texto) return;
  els.iaInput.value = '';
  addMsg('user', escapeHtml(texto));
  setTyping(true);
  els.iaSend.disabled = true;
  setTimeout(() => {
    setTyping(false);
    const resp = responderIA(texto);
    addMsg('assistant', resp);
    els.iaSend.disabled = false;
    toast('Respuesta del asistente (simulada)');
  }, 1200);
}

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Events */
els.btnBack.onclick = () => { setProv(null); };
els.btnOpenIA.onclick = () => { els.assistant.classList.add('open'); els.btnOpenIA.classList.add('active'); STATE.iaOpen = true; };
els.btnCloseIA.onclick = () => { els.assistant.classList.remove('open'); els.btnOpenIA.classList.remove('active'); STATE.iaOpen = false; };
els.iaSend.onclick = handleSend;
els.iaInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };
els.mapLayer.onclick = (e) => {
  const m = e.target.closest('.map-marker'); if (!m) return;
  STATE.seleccionada = Number(m.dataset.id); render();
};
els.list.onclick = (e) => {
  const card = e.target.closest('.station-card'); if (!card) return;
  const fav = e.target.closest('.fav');
  if (fav) { e.stopPropagation(); const id = Number(fav.dataset.id); const est = ESTACIONES.find(e2 => e2.id === id); est.favorito = !est.favorito; render(); return; }
  STATE.seleccionada = Number(card.dataset.id); render();
};
els.quick.onclick = (e) => {
  const btn = e.target.closest('.quick-btn'); if (!btn) return;
  els.iaInput.value = btn.dataset.q;
  handleSend();
};

renderChips(); render();
</script>
</body>
</html>
