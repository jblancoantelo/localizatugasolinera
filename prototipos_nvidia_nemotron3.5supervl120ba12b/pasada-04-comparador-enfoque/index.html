<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prototipo 4 · Comparador · Gasolineras</title>
<link rel="preload" as="script" href="../datos-fake.js">
<script src="../datos-fake.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #1a73e8;
  --brand-dark: #1557b0;
  --surface: #ffffff;
  --bg: #f4f6f9;
  --text: #1a1a2e;
  --muted: #6b7280;
  --line: #e5e7eb;
  --green: #2e7d32;
  --orange: #f57c00;
  --red: #c62828;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 14px;
  --touch: 44px;
}
html, body { height: 100%; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100vh; position: relative; }

/* Header */
.app-header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: max(0.5rem, env(safe-area-inset-top)) 1rem 0.6rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.app-header .back { display: none; font-size: 1.3rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0.4rem; border-radius: 50%; }
.app-header .back.show { display: block; }
.app-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.3px; flex: 1; text-align: center; }
.app-actions { display: flex; gap: 0.3rem; align-items: center; }
.icon-btn { width: var(--touch); height: var(--touch); border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text); }
.icon-btn:hover { background: #f1f3f5; }
.icon-btn.active { background: #e8f0fe; border-color: var(--brand); color: var(--brand); }

/* Chips */
.chip-bar { display: flex; gap: 0.4rem; padding: 0.5rem 1rem 0.4rem; overflow-x: auto; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 0.78rem; color: var(--text); cursor: pointer; white-space: nowrap; min-height: var(--touch); }
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--shadow); }
.chip .remove { font-size: 1rem; line-height: 1; padding: 0 0.1rem; }

/* Search */
.search-wrap { padding: 0.4rem 1rem; display: none; gap: 0.5rem; align-items: center; background: #fff; border-bottom: 1px solid var(--line); }
.search-wrap.open { display: flex; }
.search-wrap input { flex: 1; padding: 0.55rem 0.9rem; border: 1px solid var(--line); border-radius: 10px; font-size: 0.9rem; background: #f8fafc; }
.search-wrap input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }

/* Selection bar */
.sel-bar { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; background: #fff; border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
.sel-bar .count { font-weight: 700; color: var(--brand); }
.sel-bar .btn-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 0.2rem; border-radius: 50%; }
.sel-bar .btn-clear:hover { background: #fee2e2; color: #c62828; }

/* View container */
.view { flex: 1; overflow-y: auto; padding: 0.5rem 1rem 90px; position: relative; }
.view > section { display: none; }
.view > section.active { display: block; }

/* Empty */
.empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty h3 { font-size: 1rem; margin-bottom: 0.3rem; color: var(--text); }

/* Map */
.map-wrap { position: relative; height: 200px; border-radius: var(--radius); overflow: hidden; background: #dbeafe; margin-bottom: 0.6rem; border: 1px solid var(--line); }
.map-canvas { width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); position: relative; }
.map-layer { position: absolute; inset: 0; pointer-events: none; }
.map-marker { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer; transform: translate(-50%, -50%); display: grid; place-items: center; font-size: 0.75rem; z-index: 5; transition: transform 0.15s, box-shadow 0.15s; }
.map-marker.green { background: var(--green); }
.map-marker.orange { background: var(--orange); }
.map-marker.red { background: var(--red); }
.map-marker.selected { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(26,115,232,0.35); }

/* Station cards */
.card-list { display: flex; flex-direction: column; gap: 0.6rem; }
.station-card { display: flex; align-items: center; gap: 0.7rem; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.65rem 0.8rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s; min-height: var(--touch); }
.station-card:active { transform: scale(0.995); }
.station-card.selected { border-color: var(--brand); background: #eef6ff; }
.station-card.in-comparison { border-color: var(--brand); background: #eef6ff; position: relative; }
.station-card.in-comparison::after { content: '✓'; position: absolute; top: 6px; right: 8px; background: var(--brand); color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 0.7rem; display: grid; place-items: center; }
.station-card .rank { width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; color: #6b7280; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.station-card .rank.best { background: var(--green); color: #fff; }
.station-card .info { flex: 1; min-width: 0; }
.station-card .name { font-weight: 700; font-size: 0.86rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-card .addr { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.station-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
.station-card .price { font-weight: 800; font-size: 1rem; color: var(--text); }
.station-card .price .uni { font-size: 0.6rem; color: var(--muted); font-weight: 600; }
.station-card .dist { font-size: 0.68rem; color: var(--muted); background: #f1f5f9; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid #cbd5e1; }
.station-card .fav { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 0.95rem; color: #b0b0b0; flex-shrink: 0; }
.station-card .fav.on { color: #f9a825; border-color: #f9a825; background: #fff7e0; }
.station-card .add-cmp { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 0.9rem; color: var(--muted); flex-shrink: 0; }
.station-card .add-cmp.on { background: var(--brand); color: #fff; border-color: var(--brand); }

/* Legend */
.legend { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.5rem; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 0.25rem; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; }

/* Comparison panel (bottom) */
.comparison-panel { position: fixed; inset: auto 0 0 0; z-index: 80; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 20px rgba(0,0,0,0.1); transform: translateY(100vh); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); height: 42vh; min-height: 260px; display: flex; flex-direction: column; overflow: hidden; }
.comparison-panel.open { transform: translateY(0); }
.comparison-panel .cmp-header { padding: 0.6rem 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.comparison-panel .cmp-header h2 { font-size: 0.95rem; font-weight: 700; }
.comparison-panel .cmp-close { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--muted); padding: 0.2rem; border-radius: 50%; }
.comparison-panel .cmp-close:hover { background: #f1f3f5; }
.cmp-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); }
.cmp-empty .icon { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.4; }
.cmp-rows { flex: 1; overflow-y: auto; padding: 0.6rem; display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.cmp-card { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem; background: #fff; display: flex; flex-direction: column; gap: 0.4rem; }
.cmp-card .name { font-weight: 700; font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-card .addr { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-card .price { font-weight: 800; font-size: 1.05rem; }
.cmp-card .remove-cmp { background: none; border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 0.9rem; color: var(--muted); align-self: flex-start; }
.cmp-card .remove-cmp:hover { background: #fee2e2; color: #c62828; border-color: #c62828; }

/* Chart superposed */
.chart-wrap { position: relative; height: 140px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-top: 0.5rem; }
.chart-canvas { width: 100%; height: 100%; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: max(env(safe-area-inset-bottom), 0.5rem); left: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem; box-shadow: var(--shadow); z-index: 60; }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.42rem 0.25rem; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.62rem; color: #94a3b8; min-height: var(--touch); }
.nav-tab .icon { font-size: 1.25rem; line-height: 1; }
.nav-tab.active { background: #eef2ff; color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }

/* Toast */
.toast { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(26,26,46,0.9); color: #fff; padding: 0.6rem 1rem; border-radius: 24px; font-size: 0.8rem; z-index: 70; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Desktop layout */
@media (min-width: 1024px) {
  .app { flex-direction: row; }
  .app-header { position: fixed; inset: 0 0 auto 0; width: 100%; flex-direction: column; padding: 1rem; }
  .app-header .app-actions { margin-left: auto; }
  .view { padding-bottom: 120px; padding-right: 460px; }
  .comparison-panel { inset: auto 0 0 auto; width: 440px; height: 100%; top: 0; right: 0; border-left: 1px solid var(--line); border-top: none; transform: translateX(100%); border-radius: 0; }
  .comparison-panel.open { transform: translateX(0); }
  .comparison-panel .cmp-header { position: sticky; top: 0; background: #fff; z-index: 5; }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="back" id="btnBack">‹</button>
    <div class="app-title" id="headerTitle">Gasolineras</div>
    <div class="app-actions">
      <button class="icon-btn" id="btnMap" title="Mapa">🗺️</button>
      <button class="icon-btn" id="btnList" title="Listado" active>📋</button>
      <button class="icon-btn" id="btnSearch" title="Buscar">🔍</button>
    </div>
  </header>

  <div class="chip-bar" id="chipBar"></div>

  <div class="search-wrap" id="searchWrap">
    <input type="text" id="inpSearch" placeholder="Buscar estación…">
    <button class="icon-btn" id="btnCloseSearch" style="font-size:1.2rem">✕</button>
  </div>

  <div class="sel-bar" id="selBar" style="display:none">
    <span>Seleccionadas: <span id="selCount" class="count">0</span> / 3</span>
    <button class="btn-clear" id="btnSelClear">✕</button>
  </div>

  <div class="view" id="view">
    <section id="secEmpty" class="active">
      <div class="empty">
        <div class="icon">📍</div>
        <h3>Selecciona una provincia</h3>
        <p>Elige una provincia y compara hasta 3 estaciones.</p>
      </div>
    </section>
    <section id="secMain">
      <div class="map-wrap" id="mapWrap">
        <div class="map-canvas" id="mapCanvas"></div>
        <div class="map-layer" id="mapLayer"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card-list" id="list"></div>
    </section>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab active" data-tab="list"><span class="icon">📋</span><span>Listado</span></button>
    <button class="nav-tab" data-tab="map"><span class="icon">🗺️</span><span>Mapa</span></button>
  </nav>

  <div class="comparison-panel" id="cmpPanel">
    <div class="cmp-header">
      <h2 id="cmpTitle">Comparador</h2>
      <button class="cmp-close" id="btnCmpClose">✕</button>
    </div>
    <div id="cmpEmpty" class="cmp-empty">
      <div class="icon">⚖️</div>
      <div>Selecciona hasta 3 estaciones para comparar precios e histórico</div>
    </div>
    <div id="cmpRows" class="cmp-rows" style="display:none"></div>
    <div class="chart-wrap" id="cmpChartWrap" style="display:none"><canvas class="chart-canvas" id="cmpCanvas"></canvas></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script>
const MAX_CMP = 3;
const STATE = {
  prov: null,
  combustible: '',
  marca: '',
  buscar: '',
  soloFav: false,
  view: 'list',
  comparando: new Set(),
  seleccionada: null,
};
const COMB = 'Precio Gasolina 95 E5';

const els = {
  chipBar: document.getElementById('chipBar'),
  searchWrap: document.getElementById('searchWrap'),
  inpSearch: document.getElementById('inpSearch'),
  btnSearch: document.getElementById('btnSearch'),
  btnCloseSearch: document.getElementById('btnCloseSearch'),
  btnMap: document.getElementById('btnMap'),
  btnList: document.getElementById('btnList'),
  secEmpty: document.getElementById('secEmpty'),
  secMain: document.getElementById('secMain'),
  list: document.getElementById('list'),
  mapLayer: document.getElementById('mapLayer'),
  headerTitle: document.getElementById('headerTitle'),
  btnBack: document.getElementById('btnBack'),
  selBar: document.getElementById('selBar'),
  selCount: document.getElementById('selCount'),
  btnSelClear: document.getElementById('btnSelClear'),
  cmpPanel: document.getElementById('cmpPanel'),
  cmpEmpty: document.getElementById('cmpEmpty'),
  cmpRows: document.getElementById('cmpRows'),
  cmpChartWrap: document.getElementById('cmpChartWrap'),
  cmpCanvas: document.getElementById('cmpCanvas'),
  btnCmpClose: document.getElementById('btnCmpClose'),
  toast: document.getElementById('toast'),
};

function toast(msg) {
  const t = els.toast; t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function chip(label, active, onClick, removable) {
  const c = document.createElement('button');
  c.className = 'chip ' + (active ? 'active' : '');
  c.innerHTML = label + (removable ? ' <span class="remove">✕</span>' : '');
  if (onClick) c.onclick = (e) => { e.stopPropagation(); onClick(); };
  if (removable) c.querySelector('.remove').onclick = (e) => { e.stopPropagation(); onClick(); };
  return c;
}

function renderChips() {
  els.chipBar.innerHTML = '';
  if (STATE.prov) {
    const p = PROVINCIAS.find(x => x.id === STATE.prov);
    els.chipBar.appendChild(chip(p.nombre, true, () => setProv(null), true));
  } else {
    PROVINCIAS.forEach(p => els.chipBar.appendChild(chip(p.nombre, false, () => setProv(p.id))));
  }
  if (STATE.combustible) els.chipBar.appendChild(chip('Gasolina 95', true, () => setComb('')));
  if (STATE.marca) els.chipBar.appendChild(chip(STATE.marca, true, () => setMarca(''), true));
  if (STATE.soloFav) els.chipBar.appendChild(chip('⭐ Favoritos', true, () => setFav(false), true));
  if (STATE.buscar) els.chipBar.appendChild(chip('🔍 ' + STATE.buscar, true, () => setBuscar(''), true));
}

function setProv(v) { STATE.prov = v; STATE.seleccionada = null; renderChips(); render(); }
function setComb(v) { STATE.combustible = v; renderChips(); render(); }
function setMarca(v) { STATE.marca = v; renderChips(); render(); }
function setFav(v) { STATE.soloFav = v; renderChips(); render(); }
function setBuscar(v) { STATE.buscar = v; renderChips(); render(); }

function toggleCmp(id) {
  if (STATE.comparando.has(id)) { STATE.comparando.delete(id); }
  else if (STATE.comparando.size < MAX_CMP) { STATE.comparando.add(id); }
  else { toast('Máximo ' + MAX_CMP + ' estaciones'); return; }
  renderSelBar(); renderList(); renderCmp();
}

function renderSelBar() {
  els.selBar.style.display = STATE.comparando.size ? 'flex' : 'none';
  els.selCount.textContent = STATE.comparando.size;
}

function listaFiltrada() {
  const base = STATE.prov ? ESTACIONES.porProvincia(STATE.prov) : ESTACIONES;
  return filtrarEstaciones(base, { provincia: STATE.prov, combustible: STATE.combustible, marca: STATE.marca, buscar: STATE.buscar, soloFavoritos: STATE.soloFav });
}

function precioColor(est) {
  const p = est.precios[COMB] || 0;
  return p <= 1.45 ? 'green' : p <= 1.60 ? 'orange' : 'red';
}

function render() {
  if (!STATE.prov) {
    els.secEmpty.classList.add('active'); els.secMain.classList.remove('active');
    els.headerTitle.textContent = 'Gasolineras'; els.btnBack.style.display = 'none';
    renderSelBar(); renderCmp(); return;
  }
  els.secEmpty.classList.remove('active'); els.secMain.classList.add('active');
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.headerTitle.textContent = prov.nombre; els.btnBack.style.display = 'block';
  const lista = ordenarEstaciones(listaFiltrada(), 'precio', true);
  renderMap(lista);
  renderList(lista);
  renderSelBar(); renderCmp();
}

function renderMap(lista) {
  if (!STATE.prov) { els.mapLayer.innerHTML = ''; return; }
  const prov = PROVINCIAS.find(p => p.id === STATE.prov);
  els.mapLayer.innerHTML = lista.map(est => {
    const c = precioColor(est);
    const x = 50 + ((est.lat - prov.centro[0]) / 0.2) * 40;
    const y = 50 + ((prov.centro[1] - est.lng) / 0.2) * 40;
    return `<div class="map-marker ${c} ${STATE.comparando.has(est.id) ? 'selected' : ''} ${est.id === STATE.seleccionada ? 'selected' : ''}" style="left:${Math.max(5,Math.min(95,x))}%;top:${Math.max(5,Math.min(95,y))}%;" data-id="${est.id}" title="${est.nombre}">${est.marca[0]}</div>`;
  }).join('');
}

function renderList(lista) {
  els.list.innerHTML = lista.map(est => {
    const c = precioColor(est);
    const favCls = est.favorito ? 'on' : '';
    const inCmp = STATE.comparando.has(est.id) ? 'in-comparison' : '';
    const best = est.esMejor ? '<div class="rank best">1</div>' : '<div class="rank">-</div>';
    return `<div class="station-card ${inCmp} ${est.id === STATE.seleccionada ? 'selected' : ''}" data-id="${est.id}">
      ${best}
      <div class="info">
        <div class="name">${est.nombre}</div>
        <div class="addr">${est.direccion} · ${est.localidad}</div>
      </div>
      <div class="right">
        <div class="price">${formatearPrecio(est.precios[COMB] || 0)} <span class="uni">€/L</span></div>
        <div class="dist" style="color:${c === 'green' ? '#2e7d32' : c === 'orange' ? '#f57c00' : '#c62828'};">${formatearDistancia(est.distancia)}</div>
        <button class="fav ${favCls}" data-id="${est.id}">${est.favorito ? '★' : '☆'}</button>
        <button class="add-cmp ${STATE.comparando.has(est.id) ? 'on' : ''}" data-id="${est.id}">${STATE.comparando.has(est.id) ? '✓' : '+'}</button>
      </div>
    </div>`;
  }).join('');
}

function renderCmp() {
  const sel = ESTACIONES.filter(e => STATE.comparando.has(e.id));
  if (sel.length === 0) {
    els.cmpEmpty.style.display = 'block';
    els.cmpRows.style.display = 'none';
    els.cmpChartWrap.style.display = 'none';
    return;
  }
  els.cmpEmpty.style.display = 'none';
  els.cmpRows.style.display = 'grid';
  els.cmpChartWrap.style.display = 'block';
  els.cmpRows.innerHTML = sel.map(est => {
    const c = precioColor(est);
    const pDesc = precioConDescuento(est, COMB);
    return `<div class="cmp-card">
      <button class="remove-cmp" data-id="${est.id}">✕</button>
      <div class="name">${est.nombre}</div>
      <div class="addr">${est.direccion}</div>
      <div class="price" style="color:${c === 'green' ? '#2e7d32' : c === 'orange' ? '#f57c00' : '#c62828'};">${formatearPrecio(est.precios[COMB] || 0)} <span style="font-size:0.6rem;font-weight:600;color:var(--muted)">€/L</span></div>
      <div style="font-size:0.7rem;color:var(--muted)">Desc: ${est.descuento.toFixed(2)} €/L → ${formatearPrecio(pDesc)}</div>
    </div>`;
  }).join('');
  dibujarGraficaCmp(sel);
}

function dibujarGraficaCmp(sel) {
  const cv = els.cmpCanvas; const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth; const h = 140;
  cv.width = w * dpr; cv.height = h * dpr; ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (sel.length < 1) return;
  const series = sel.map(est => ({
    nombre: est.nombre,
    color: precioColor(est) === 'green' ? '#2e7d32' : precioColor(est) === 'orange' ? '#f57c00' : '#c62828',
    datos: historicoParaGrafica(est, COMB).map(f => f.precio),
  }));
  const todos = series.flatMap(s => s.datos);
  const min = Math.min(...todos), max = Math.max(...todos);
  const pad = (max - min) * 0.15 || 1; const yMin = min - pad; const yMax = max + pad;
  const n = sel[0].datos.length; const xStep = w / (n - 1 || 1);
  const toY = p => h - 18 - ((p - yMin) / (yMax - yMin)) * (h - 36);
  series.forEach(s => {
    ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 2;
    s.datos.forEach((p, i) => {
      const x = i * xStep; const y = toY(p);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    s.datos.forEach((p, i) => {
      const x = i * xStep; const y = toY(p);
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fillStyle = i === n - 1 ? s.color : '#e5e7eb'; ctx.fill();
    });
    const last = s.datos[s.datos.length - 1];
    ctx.fillStyle = s.color; ctx.font = '600 10px system-ui';
    ctx.fillText(formatearPrecio(last) + ' ' + s.nombre, w - 120, toY(last) + 4);
  });
}

function cerrarCmp() { STATE.comparando.clear(); renderSelBar(); renderList(); renderCmp(); }

/* Events */
els.btnBack.onclick = () => { setProv(null); };
els.btnList.onclick = () => { STATE.view = 'list'; els.btnList.classList.add('active'); els.btnMap.classList.remove('active'); render(); };
els.btnMap.onclick = () => { STATE.view = 'map'; els.btnMap.classList.add('active'); els.btnList.classList.remove('active'); render(); };
els.btnSearch.onclick = () => { els.searchWrap.classList.add('open'); els.inpSearch.focus(); };
els.btnCloseSearch.onclick = (e) => { e.stopPropagation(); els.searchWrap.classList.remove('open'); els.inpSearch.value = ''; setBuscar(''); };
els.inpSearch.oninput = (e) => setBuscar(e.target.value);
els.btnSelClear.onclick = cerrarCmp;
els.btnCmpClose.onclick = cerrarCmp;

els.list.onclick = (e) => {
  const card = e.target.closest('.station-card'); if (!card) return;
  const fav = e.target.closest('.fav'); const addCmp = e.target.closest('.add-cmp');
  if (fav) { e.stopPropagation(); const id = Number(fav.dataset.id); const est = ESTACIONES.find(e2 => e2.id === id); est.favorito = !est.favorito; renderList(); return; }
  if (addCmp) { e.stopPropagation(); toggleCmp(Number(addCmp.dataset.id)); return; }
  STATE.seleccionada = Number(card.dataset.id); renderList(); renderCmp();
};
els.mapLayer.onclick = (e) => {
  const m = e.target.closest('.map-marker'); if (!m) return;
  STATE.seleccionada = Number(m.dataset.id); renderList(); renderCmp();
};
els.cmpRows.onclick = (e) => {
  const btn = e.target.closest('.remove-cmp'); if (!btn) return;
  e.stopPropagation(); toggleCmp(Number(btn.dataset.id));
};

renderChips(); render();
</script>
