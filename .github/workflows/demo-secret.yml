name: Demo secreto API_KEY

on:
  workflow_dispatch:

jobs:
  leer-secreto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recuperar secreto del repositorio
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Longitud: ${#API_KEY} caracteres"
          echo "API_KEY cargada correctamente (enmascarada en el log)"
