<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDF3FE"/>
      <stop offset="50%" stop-color="#B2DCF5"/>
      <stop offset="100%" stop-color="#9AD0F2"/>
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2ECF1"/>
      <stop offset="100%" stop-color="#9AADB7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9AB50"/>
      <stop offset="100%" stop-color="#E2713A"/>
    </linearGradient>
    <linearGradient id="pinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#82D4F7"/>
      <stop offset="45%" stop-color="#45A3DB"/>
      <stop offset="100%" stop-color="#1C6DB2"/>
    </linearGradient>
    <linearGradient id="noz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F25942"/>
      <stop offset="100%" stop-color="#D5372A"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M183,45 H318 A32,32 0 0 1 350,77 V305 A32,32 0 0 1 318,337 H183 A32,32 0 0 1 151,305 V77 A32,32 0 0 1 183,45 Z"/>
    </clipPath>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="117" fill="url(#bg)"/>

  <!-- sombra de la bombona -->
  <ellipse cx="254" cy="390" rx="128" ry="13" fill="#0B3A5E" opacity="0.18"/>

  <!-- ===== bombona ===== -->
  <g>
    <!-- halo claro (sticker) -->
    <path d="M183,43 H318 A34,34 0 0 1 352,77 V305 A34,34 0 0 1 318,339 H183 A34,34 0 0 1 149,305 V77 A34,34 0 0 1 183,43 Z"
          fill="none" stroke="#EAF6FF" stroke-width="4" opacity="0.4"/>

    <!-- base / peana -->
    <rect x="135" y="337" width="234" height="39" rx="8" fill="#5C6D77"/>
    <rect x="135" y="337" width="234" height="39" rx="8" fill="none" stroke="#3B4853" stroke-width="5"/>
    <rect x="143" y="343" width="218" height="6" rx="3" fill="#93A2AB" opacity="0.5"/>

    <!-- cuerpo -->
    <path d="M183,45 H318 A32,32 0 0 1 350,77 V305 A32,32 0 0 1 318,337 H183 A32,32 0 0 1 151,305 V77 A32,32 0 0 1 183,45 Z" fill="url(#grey)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="151" y="207" width="199" height="130" fill="url(#orange)"/>
      <rect x="151" y="204" width="199" height="8" fill="#4A555E"/>
      <rect x="151" y="212" width="199" height="5" fill="#8A7350" opacity="0.45"/>
      <rect x="151" y="45" width="199" height="9" fill="#FDFEFF" opacity="0.9"/>
      <ellipse cx="203" cy="150" rx="32" ry="90" fill="#FFFFFF" opacity="0.13"/>
      <ellipse cx="332" cy="272" rx="40" ry="82" fill="#000000" opacity="0.07"/>
    </g>
    <path d="M183,45 H318 A32,32 0 0 1 350,77 V305 A32,32 0 0 1 318,337 H183 A32,32 0 0 1 151,305 V77 A32,32 0 0 1 183,45 Z"
          fill="none" stroke="#43545F" stroke-width="6"/>

    <!-- pantalla -->
    <rect x="177" y="74" width="152" height="72" rx="16" fill="#1B2A33"/>
    <rect x="181" y="78" width="144" height="64" rx="12" fill="#31485A"/>
    <text x="253" y="130" text-anchor="middle" fill="#99DFAD" font-size="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0.5">1,599</text>

    <!-- LED -->
    <rect x="230" y="155" width="44" height="14" rx="7" fill="#55BE86" stroke="#2E5D45" stroke-width="3"/>
  </g>

  <!-- ===== boquilla metalica (de bombona a nozzle) ===== -->
  <g transform="rotate(-10 357 133)">
    <rect x="336" y="126" width="46" height="14" rx="7" fill="#5D707E" stroke="#2C3A45" stroke-width="4"/>
    <rect x="341" y="129" width="30" height="4" rx="2" fill="#C9D6DE" opacity="0.7"/>
  </g>

  <!-- ===== manguera ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M359,206 V318 A21,21 0 0 0 401,318 V230" stroke="#2C3A45" stroke-width="23"/>
    <path d="M359,206 V318 A21,21 0 0 0 401,318 V230" stroke="#5D707E" stroke-width="15"/>
    <path d="M359,214 V312 Q359,332 380,332" stroke="#93A3AD" stroke-width="4" opacity="0.35"/>
  </g>

  <!-- ===== nozzle ===== -->
  <g>
    <!-- cuello metalico inferior -->
    <rect x="386" y="198" width="24" height="32" rx="7" fill="#5D707E" stroke="#384854" stroke-width="5"/>
    <!-- cuerpo rojo -->
    <path d="M386,123 C373,125 365,135 365,148 V193 C365,203 372,209 382,209 H395 C405,209 411,202 411,192 V144 C411,132 404,123 393,123 Z"
          fill="url(#noz)" stroke="#8E2A20" stroke-width="5" stroke-linejoin="round"/>
    <!-- asa / hueco -->
    <rect x="372" y="155" width="18" height="37" rx="3" fill="#33454F"/>
    <!-- brillo -->
    <path d="M372,131 C367,138 365,146 365,153" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.45" fill="none"/>
  </g>

  <!-- sombra del pin -->
  <ellipse cx="266" cy="444" rx="44" ry="9" fill="#0B3A5E" opacity="0.16"/>

  <!-- ===== pin ===== -->
  <g>
    <path d="M266,435 C257,417 202,356 202,331 C202,297 231,271 266,271 C301,271 330,297 330,331 C330,356 275,417 266,435 Z"
          fill="none" stroke="#DFEBF0" stroke-width="5" stroke-linejoin="round"/>
    <path d="M266,435 C257,417 202,356 202,331 C202,297 231,271 266,271 C301,271 330,297 330,331 C330,356 275,417 266,435 Z"
          fill="url(#pinG)" stroke="#14568F" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="241" cy="306" rx="9" ry="15" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 241 306)"/>
    <circle cx="266" cy="330" r="14" fill="#FFFFFF"/>
  </g>
</svg>
